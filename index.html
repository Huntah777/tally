/* ── receipt scanning (on-device OCR, no paid services) ── */
async function ocrImage(file, onProgress) {
  await loadScript('/vendor/tesseract/tesseract.min.js');
  /* Pre-process: scale to ~1600px wide, greyscale and stretch contrast.
     Thermal receipts are faint and low-contrast; this alone markedly
     improves Tesseract's read. Dark-mode screenshots (Deliveroo, Uber Eats
     and Just Eat all have one) are inverted first, since Tesseract expects
     dark text on a light page. */
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / bmp.width) * (bmp.width < 900 ? 1.6 : 1);
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  const lum = (i) => d[i] * .299 + d[i+1] * .587 + d[i+2] * .114;
  let min = 255, max = 0, sum = 0, n = 0;
  for (let i = 0; i < d.length; i += 16) { const v = lum(i); if (v < min) min = v; if (v > max) max = v; sum += v; n++; }
  const invert = sum / n < 110;
  const span = Math.max(1, max - min);
  for (let i = 0; i < d.length; i += 4) {
    let v = (lum(i) - min) / span * 255;
    if (invert) v = 255 - v;
    v = v < 128 ? v * 0.7 : 255 - (255 - v) * 0.7;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(img, 0, 0);
  const worker = await window.Tesseract.createWorker('eng', 1, {
    workerPath: '/vendor/tesseract/worker.min.js', corePath: '/vendor/tesseract/', langPath: '/vendor/tesseract/lang',
    logger: (m) => m.status === 'recognizing text' && onProgress?.(m.progress),
  });
  try {
    await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
    const { data } = await worker.recognize(c);
    return data.text || '';
  } finally { worker.terminate(); }
}

/* "How much of it did you have?" — for shared takeaways and split bills. */
const SHARES = [[1, 'All'], [0.5, '½'], [1 / 3, '⅓'], [0.25, '¼']];

function ReceiptFlow({ state, actions, meal: initialMeal, date, onClose }) {
  const [stage, setStage] = useState('pick'); /* pick | reading | review */
  const [progress, setProgress] = useState(0);
  const [text, setText] = useState('');
  const [items, setItems] = useState([]);
  const [kind, setKind] = useState('grocery');  /* grocery | takeaway */
  const [meal, setMeal] = useState(initialMeal);
  const [err, setErr] = useState('');
  const [editText, setEditText] = useState(false);
  const fileRef = useRef(null), camRef = useRef(null);
  const takeaway = kind === 'takeaway';

  /* Shopping: remembered/my-food matches, then Open Food Facts; nothing is
     ticked, because buying isn't eating.
     Takeaway & restaurants: remembered matches, then the typical-portion
     table; everything matched is ticked, because you ordered it to eat. */
  const build = useCallback((txt, forceKind) => {
    const k = forceKind || RC.detectKind(txt);
    setKind(k);
    const parsed = RC.parseReceiptText(txt, k);
    setItems(parsed.map((it, i) => {
      const local = RC.matchLocal(it, state.foods || [], state.aliases || {});
      const est = k === 'takeaway' && (!local || local.how !== 'remembered') ? DISH.estimate(it.name) : null;
      const pack = RC.packSize(it.name);
      const food = local?.how === 'remembered' ? local.food : est?.food || local?.food || null;
      const how = local?.how === 'remembered' ? 'remembered' : est ? 'estimate' : local?.how || null;
      const perItem = local?.how === 'remembered' ? local.grams : est ? est.grams : local?.grams || food?.serving?.g || pack?.amount || 100;
      const grams = k === 'takeaway' ? Math.round(perItem * (it.qty || 1)) : perItem;
      return { ...it, key: i, include: k === 'takeaway' && !!food, food, how, options: null, searching: false,
               grams, share: 1, pack, query: k === 'takeaway' ? it.name : RC.expand(it.name) };
    }));
    setStage('review');
  }, [state.foods, state.aliases]);

  /* Look unmatched lines up in Open Food Facts, two at a time, so the
     review fills in by itself. Free and cached at the edge. Chain items
     ("McDonald's Big Mac") are often there even when a dish isn't. */
  useEffect(() => {
    if (stage !== 'review') return;
    let cancelled = false;
    const todo = items.filter(it => !it.food && it.options == null && it.query.length >= 3).map(it => it.key);
    const worker = async () => {
      while (todo.length && !cancelled) {
        const key = todo.shift();
        const item = items.find(x => x.key === key);
        setItems(xs => xs.map(x => x.key === key ? { ...x, searching: true } : x));
        let foods = [];
        try { foods = (await api('/api/food/search?q=' + encodeURIComponent(item.query))).foods || []; } catch {}
        if (cancelled) return;
        /* Store own-brand first: on a Tesco receipt, Tesco's milk is the
           likeliest match for "TESCO SS MILK". */
        const raw = (item?.raw || '').toLowerCase();
        const own = (f) => f.brand && raw.includes(f.brand.toLowerCase().split(/[\s']/)[0]) ? 0 : 1;
        foods = [...foods].sort((p, q) => own(p) - own(q));
        /* Restaurant dishes are rarely in a product database, so for takeaways
           only keep results that actually share a word with the line (no
           '2 in 1 coffee' for '1/2 Chicken'), with typical portions first. */
        if (kind === 'takeaway') {
          const words = new Set(item.query.toLowerCase().split(/[^a-z]+/).filter(w => w.length >= 4));
          foods = [...DISH.search(item.query, 2), ...foods.filter(f => f.name.toLowerCase().split(/[^a-z]+/).some(w => words.has(w)))];
        }
        setItems(xs => xs.map(x => x.key === key ? { ...x, searching: false, options: foods.slice(0, 4) } : x));
      }
    };
    worker(); worker();
    return () => { cancelled = true; };
  }, [stage, items.length, kind]);

  const onFile = async (file) => {
    if (!file) return;
    setErr(''); setStage('reading'); setProgress(0);
    try { const t = await ocrImage(file, setProgress); setText(t); build(t); }
    catch (e) { setErr(e.message || 'Couldn’t read that photo'); setStage('pick'); }
  };
  const patch = (key, p) => setItems(xs => xs.map(x => x.key === key ? { ...x, ...p } : x));
  const eaten = (it) => (it.food ? E.portion(it.food, it.grams * (it.share || 1)) : { kcal: Math.round((Number(it.kcal) || 0) * (it.share || 1)), protein: 0, carbs: 0, fat: 0 });
  const chosen = items.filter(it => it.include && (it.food || it.kcal));
  const totalKcal = chosen.reduce((a, it) => a + eaten(it).kcal, 0);

  const commit = (logIt) => {
    const now = Date.now();
    const aliases = {};
    const foods = [];
    const entries = [];
    for (const it of items) {
      const share = it.share || 1;
      const note = share < 1 ? ` (${SHARES.find(([v]) => v === share)?.[1] || Math.round(share * 100) + '%'})` : '';
      if (!it.food) {
        if (logIt && it.include && it.kcal) entries.push({ id: uid(), date, meal, name: (takeaway ? it.name : RC.expand(it.name) || it.name) + note, ...eaten(it), source: 'receipt', created: now, updated: now });
        continue;
      }
      /* A takeaway only remembers what was actually eaten; a shop saves
         everything matched to My foods, like stocking the cupboard. */
      if (!takeaway || it.include) foods.push(it.food);
      const k = RC.aliasKey(it.name);
      /* Remember the portion per item, not per line: "2x Cheeseburger" is
         two portions today but one portion is what the line means. */
      if (k) aliases[k] = { foodId: it.food.id, grams: takeaway ? Math.round(it.grams / (it.qty || 1)) : it.grams };
      if (logIt && it.include) {
        const g = Math.round(it.grams * share);
        entries.push({ id: uid(), date, meal, name: it.food.name + (takeaway && it.qty > 1 ? ` ×${it.qty}` : '') + note, brand: it.food.brand, foodId: it.food.id, grams: g, ...E.portion(it.food, g),
                       estimate: !!it.food.estimate, source: 'receipt', created: now, updated: now });
      }
    }
    actions.receiptCommit({ foods, entries, aliases });
    onClose(logIt ? `Logged ${entries.length} item${entries.length === 1 ? '' : 's'}` : `Saved ${foods.length} food${foods.length === 1 ? '' : 's'} to My foods`);
  };

  if (stage === 'pick') return (
    <div className="stack gap16">
      <div className="card pad stack gap8" style={{background:'var(--bg-surface-2)'}}>
        <h2>Works with</h2>
        <ul className="sub" style={{marginLeft:18,lineHeight:1.6}}>
          <li><b style={{color:'var(--text-primary)'}}>Supermarket receipts.</b> Matched to real products.</li>
          <li><b style={{color:'var(--text-primary)'}}>Deliveroo, Uber Eats and Just Eat.</b> Screenshot the order in the app, or paste the email receipt.</li>
          <li><b style={{color:'var(--text-primary)'}}>Restaurant bills.</b> Dishes are estimated from typical UK portions, and you can say if you shared.</li>
        </ul>
        <p className="sub">It’s read on your phone and nothing is uploaded. Every match you confirm is remembered for next time.</p>
      </div>
      <input ref={camRef} type="file" accept="image/*" capture="environment" hidden onChange={e => onFile(e.target.files[0])}/>
      <input ref={fileRef} type="file" accept="image/*" hidden onChange={e => onFile(e.target.files[0])}/>
      <div className="row gap10">
        <button className="btn primary grow" onClick={() => camRef.current.click()}>{Ic.camera} Take photo</button>
        <button className="btn grow" onClick={() => fileRef.current.click()}>{Ic.image} Screenshot</button>
      </div>
      <button className="btn block" onClick={() => { setEditText(true); setStage('review'); setItems([]); }}>{Ic.receipt} Paste from an email or app</button>
      {err && <div className="err">{err}</div>}
    </div>);

  if (stage === 'reading') return (
    <div className="stack gap16" style={{alignItems:'center',padding:'30px 0'}}>
      <div className="spinner" style={{width:34,height:34,borderWidth:3.5}}/>
      <div style={{fontWeight:700}}>Reading your receipt…</div>
      <div className="bar" style={{width:'70%'}}><i style={{width: Math.round(progress * 100) + '%', background:'var(--accent)'}}/></div>
      <div className="sub">The first scan downloads the reader (about 7 MB). After that it’s quicker and works offline.</div>
    </div>);

  return (
    <div className="stack gap16">
      {(editText || !items.length) && <div className="stack gap8">
        <Field label="Receipt text" hint="Paste an order email, or fix misread lines. Put one item per line with its price at the end, e.g. “1x Chicken Katsu Curry £11.95”.">
          <textarea className="input num" rows={8} value={text} onChange={e => setText(e.target.value)} placeholder={'1x Big Mac Meal £7.49\n2 Margherita 21.00\nTESCO SS MILK 2L 1.45'}/>
        </Field>
        <button className="btn sm" disabled={!text.trim()} onClick={() => { build(text); setEditText(false); }}>Find items</button>
      </div>}
      {!!items.length && <>
        <Seg value={kind} onChange={(k) => build(text, k)} options={[['grocery','Shopping'],['takeaway','Takeaway / restaurant']]}/>
        <div className="row between"><div className="sub">{items.length} item{items.length === 1 ? '' : 's'} found. {takeaway ? 'Untick anything you didn’t eat.' : 'Tick what you ate.'}</div>
          {!editText && <button className="btn ghost sm" onClick={() => setEditText(true)}>Edit text</button>}</div>
        {takeaway && items.some(i => i.how === 'estimate') && <div className="sub" style={{fontSize:13}}>Dishes marked <b>estimate</b> use typical UK portions. Restaurant portions vary a lot, so adjust if yours looked bigger or smaller.</div>}
      </>}
      <div className="stack">
        {items.map(it => (
          <div key={it.key} className="stack gap8" style={{padding:'12px 0',borderTop:'.5px solid var(--sep)'}}>
            <div className="row gap10">
              <input type="checkbox" className="check" checked={it.include} onChange={e => patch(it.key, { include: e.target.checked })} aria-label={`Ate ${it.name}`}/>
              <div className="grow">
                <div className="num" style={{fontSize:12.5,color:'var(--text-muted)'}}>{it.mod ? '+ ' : ''}{it.name}{it.qty > 1 ? ` ×${it.qty}` : ''}</div>
                {it.food
                  ? <div style={{fontWeight:600}}>{it.food.name}{it.food.brand && !it.food.estimate ? <span className="muted"> · {it.food.brand}</span> : null}
                      {it.how === 'remembered' && <span className="chip on" style={{height:20,fontSize:11,padding:'0 7px',marginLeft:6}}>remembered</span>}
                      {it.how === 'estimate' && <span className="chip" style={{height:20,fontSize:11,padding:'0 7px',marginLeft:6,color:'var(--warning)'}}>estimate</span>}</div>
                  : it.searching ? <div className="row gap8 sub"><span className="spinner" style={{width:14,height:14}}/>Matching “{it.query}”…</div>
                  : <div className="sub">{it.options?.length ? 'Pick a match, or search' : 'No match found. Search or enter kcal'}</div>}
              </div>
              {it.food && <button className="btn ghost sm" onClick={() => patch(it.key, { food: null, how: null, options: it.options || null })}>Change</button>}
            </div>
            {!it.food && <div className="row gap6 wrap" style={{paddingLeft:34}}>
              {(it.options || []).map(f => <button key={f.id} className="chip" onClick={() => patch(it.key, { food: f, how: null, grams: Math.round((takeaway ? (f.serving?.g || 100) * (it.qty || 1) : it.pack?.amount || f.serving?.g || 100)), include: true })}>{f.name}{f.brand && !f.estimate ? ` · ${f.brand}` : ''} <span className="muted num">{f.serving && takeaway ? `${E.portion(f, f.serving.g).kcal} kcal` : `${f.per100.kcal}/100`}</span></button>)}
              <div className="row gap6" style={{width:'100%'}}>
                <input className="input" style={{height:38,fontSize:15}} placeholder="Search for it…" defaultValue={it.query} onKeyDown={async e => {
                  if (e.key !== 'Enter') return;
                  const q = e.currentTarget.value; patch(it.key, { searching: true, query: q });
                  let foods = []; try { foods = (await api('/api/food/search?q=' + encodeURIComponent(q))).foods || []; } catch {}
                  patch(it.key, { searching: false, options: [...DISH.search(q, 2), ...foods].slice(0, 6) });
                }}/>
                <input className="input num" style={{height:38,width:110,fontSize:15}} inputMode="numeric" placeholder="or kcal" value={it.kcal || ''} onChange={e => patch(it.key, { kcal: e.target.value.replace(/\D/g,''), include: !!e.target.value })}/>
              </div>
            </div>}
            {it.food && it.include && <div className="row gap8 wrap" style={{paddingLeft:34}}>
              {!takeaway && it.food.serving?.g && <button className={'chip' + (it.grams === it.food.serving.g ? ' on' : '')} onClick={() => patch(it.key, { grams: it.food.serving.g })}>1 serving</button>}
              {!takeaway && it.pack?.amount && <button className={'chip' + (it.grams === it.pack.amount ? ' on' : '')} onClick={() => patch(it.key, { grams: it.pack.amount })}>Whole pack</button>}
              {takeaway && <div className="seg" style={{flex:'0 1 auto'}} role="group" aria-label="How much you ate">
                {SHARES.map(([v, l]) => <button key={l} className={it.share === v ? 'on' : ''} style={{height:30,minWidth:42,fontSize:13}} onClick={() => patch(it.key, { share: v })}>{l}</button>)}
              </div>}
              <div className="row gap6"><input className="input num" style={{height:32,width:78,fontSize:14}} inputMode="decimal" value={it.grams} onChange={e => patch(it.key, { grams: parseFloat(e.target.value) || 0 })} aria-label="Amount"/><span className="muted">{it.food.unit || 'g'}</span></div>
              <span className="num" style={{fontWeight:700,marginLeft:'auto'}}>{fmtK(eaten(it).kcal)} kcal</span>
            </div>}
            {!it.food && it.include && it.kcal && takeaway && <div className="row gap8" style={{paddingLeft:34}}>
              <div className="seg" style={{flex:'0 1 auto'}} role="group" aria-label="How much you ate">
                {SHARES.map(([v, l]) => <button key={l} className={it.share === v ? 'on' : ''} style={{height:30,minWidth:42,fontSize:13}} onClick={() => patch(it.key, { share: v })}>{l}</button>)}
              </div>
              <span className="num" style={{fontWeight:700,marginLeft:'auto'}}>{fmtK(eaten(it).kcal)} kcal</span>
            </div>}
          </div>))}
      </div>
      {!!items.length && <>
        {takeaway && <button className="btn sm" style={{alignSelf:'flex-start'}} onClick={() => setItems(xs => xs.map(x => ({ ...x, share: 0.5 })))}>Split everything in half</button>}
        <Field label="Log to" group><Seg value={meal} onChange={setMeal} options={E.MEALS.map(k => [k, MEAL_LABEL[k]])}/></Field>
        <div className="row gap10">
          {!takeaway && <button className="btn grow" onClick={() => commit(false)} disabled={!items.some(i => i.food)}>Save to My foods</button>}
          <button className="btn primary grow" onClick={() => commit(true)} disabled={!chosen.length}>Log {chosen.length || ''} · {fmtK(totalKcal)} kcal</button>
        </div>
      </>}
    </div>);
}

/* ── add food sheet ── */
function AddFoodSheet({ state, actions, date, meal: initialMeal, tab: initialTab, onClose }) {
  const [tab, setTab] = useState(initialTab || 'search');
  const [meal, setMeal] = useState(initialMeal || mealForNow());
  const [picked, setPicked] = useState(null);       /* food awaiting a portion */
  const [q, setQ] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [lookup, setLookup] = useState(null);       /* { code, busy, notFound, error } */
  const [quick, setQuick] = useState({ name: '', kcal: '', protein: '', carbs: '', fat: '' });

  const recent = useMemo(() => [...(state.foods || [])].sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0)), [state.foods]);
  const local = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return recent.slice(0, 12);
    return recent.filter(f => `${f.name} ${f.brand || ''}`.toLowerCase().includes(s)).slice(0, 8);
  }, [q, recent]);

  const dishHits = useMemo(() => (q.trim().length >= 3 ? DISH.search(q, 4) : []), [q]);

  useEffect(() => {
    const s = q.trim();
    if (s.length < 3) { setResults([]); return; }
    setLoading(true);
    const t = setTimeout(async () => {
      try { setResults((await api('/api/food/search?q=' + encodeURIComponent(s))).foods || []); }
      catch { setResults([]); }
      finally { setLoading(false); }
    }, 450);
    return () => clearTimeout(t);
  }, [q]);

  const onCode = async (code) => {
    const known = (state.foods || []).find(f => f.barcode === code);
    if (known) { setPicked(known); return; }
    setLookup({ code, busy: true });
    try {
      const { food } = await api('/api/food/barcode?code=' + code);
      if (food) { setLookup(null); setPicked(food); } else setLookup({ code, notFound: true });
    } catch (e) { setLookup({ code, error: e.offline ? 'You’re offline. Barcode lookups need a connection.' : e.message }); }
  };

  const add = (food, grams, m) => {
    actions.addEntry({ date, meal, name: food.name, brand: food.brand, foodId: food.id, grams, ...m, source: tab === 'barcode' ? 'barcode' : 'search' }, food);
    onClose(`Added ${food.name}`);
  };

  const FoodRow = ({ f }) => (
    <div className="list-row" onClick={() => setPicked(f)}>
      {f.image ? <img className="thumb" src={f.image} alt="" loading="lazy"/> : <div className="thumb row" style={{justifyContent:'center',color:'var(--text-muted)'}}>{Ic.bolt}</div>}
      <div className="grow"><div className="name">{f.name}</div><div className="meta">{[f.brand, f.serving ? `${E.portion(f, f.serving.g).kcal} kcal per ${f.serving.label}` : `${f.per100.kcal} kcal per 100${f.unit || 'g'}`].filter(Boolean).join(' · ')}</div></div>
      <span className="icon-btn" style={{color:'var(--accent)'}}>{Ic.plus}</span>
    </div>);

  const title = picked ? 'How much?' : `Add to ${MEAL_LABEL[meal]}`;
  return (
    <Sheet title={title} onClose={() => onClose()} wide={tab === 'receipt'}>
      {picked
        ? <div className="stack gap12">
            <PortionPicker food={picked} meal={meal} setMeal={setMeal} onAdd={(g, m) => add(picked, g, m)}/>
            <button className="btn ghost sm" onClick={() => setPicked(null)}>Back</button>
          </div>
        : <div className="stack gap16">
            <Seg value={tab} onChange={(t) => { setTab(t); setLookup(null); }} options={[['search','Search'],['barcode','Barcode'],['receipt','Receipt'],['quick','Quick add']]}/>
            {tab === 'search' && <>
              <div style={{position:'relative'}}>
                <input className="input" autoFocus placeholder="Search foods, brands…" value={q} onChange={e => setQ(e.target.value)} style={{paddingLeft:40}}/>
                <span style={{position:'absolute',left:12,top:12,width:20,height:20,color:'var(--text-muted)'}}>{Ic.search}</span>
              </div>
              {!!local.length && <div><div className="label" style={{marginBottom:4}}>{q ? 'My foods' : 'Recent'}</div><div className="stack">{local.map(f => <FoodRow key={f.id} f={f}/>)}</div></div>}
              {dishHits.length > 0 && <div><div className="label" style={{marginBottom:4}}>Takeaway & restaurant · estimates</div><div className="stack">{dishHits.map(f => <FoodRow key={f.id} f={f}/>)}</div></div>}
              {q.trim().length >= 3 && <div>
                <div className="row gap8" style={{marginBottom:4}}><div className="label">Products · Open Food Facts</div>{loading && <span className="spinner" style={{width:14,height:14}}/>}</div>
                <div className="stack">{results.map(f => <FoodRow key={f.id} f={f}/>)}</div>
                {!loading && !results.length && <div className="sub" style={{padding:'10px 0'}}>Nothing found. Try fewer words, or <a href="#" onClick={e => { e.preventDefault(); setTab('quick'); setQuick(o => ({...o, name: q})); }} style={{color:'var(--accent)'}}>quick add it</a>.</div>}
              </div>}
              {!q && !local.length && <div className="sub">Search millions of products, or scan a barcode. Foods you log show up here for one-tap re-adding.</div>}
            </>}
            {tab === 'barcode' && (lookup?.notFound
              ? <div className="stack gap12"><div className="card pad" style={{background:'var(--bg-surface-2)'}}><b>Barcode {lookup.code} isn’t in Open Food Facts yet.</b><div className="sub">Add it from the label once and Tally will know it from now on.</div></div>
                  <CustomFoodForm barcode={lookup.code} onSave={(f) => { actions.saveFood(f); setLookup(null); setPicked(f); }}/></div>
              : lookup?.busy ? <div className="row gap10" style={{justifyContent:'center',padding:30}}><span className="spinner"/>Looking up {lookup.code}…</div>
              : <>{lookup?.error && <div className="err">{lookup.error}</div>}<BarcodeScanner key={lookup?.code || 'scan'} onCode={onCode}/></>)}
            {tab === 'receipt' && <ReceiptFlow state={state} actions={actions} meal={meal} date={date} onClose={onClose}/>}
            {tab === 'quick' && <div className="stack gap12">
              <Field label="What was it?"><input className="input" value={quick.name} onChange={e => setQuick({...quick, name: e.target.value})} placeholder="e.g. Pret chicken wrap"/></Field>
              <Field label="Calories"><input className="input num" inputMode="numeric" value={quick.kcal} onChange={e => setQuick({...quick, kcal: e.target.value})} placeholder="kcal"/></Field>
              <div className="row gap8">
                {['protein','carbs','fat'].map(k => <Field key={k} label={k[0].toUpperCase() + k.slice(1) + ' g'}><input className="input num" inputMode="decimal" value={quick[k]} onChange={e => setQuick({...quick, [k]: e.target.value})} placeholder="optional"/></Field>)}
              </div>
              <Field label="Meal" group><Seg value={meal} onChange={setMeal} options={E.MEALS.map(k => [k, MEAL_LABEL[k]])}/></Field>
              <button className="btn primary" disabled={!(parseFloat(quick.kcal) > 0)} onClick={() => {
                actions.addEntry({ date, meal, name: quick.name.trim() || 'Quick add', kcal: Math.round(parseFloat(quick.kcal)), protein: r1(parseFloat(quick.protein)), carbs: r1(parseFloat(quick.carbs)), fat: r1(parseFloat(quick.fat)), source: 'quick' });
                onClose('Added');
              }}>Add {quick.kcal ? fmtK(parseFloat(quick.kcal)) + ' kcal' : ''}</button>
              <div className="divider"/>
              <details><summary className="sub" style={{cursor:'pointer'}}>Create a reusable food from a label</summary><div style={{marginTop:12}}><CustomFoodForm initialName={quick.name} onSave={(f) => { actions.saveFood(f); setPicked(f); }}/></div></details>
            </div>}
          </div>}
    </Sheet>);
}

function EntrySheet({ entry, state, actions, onClose }) {
  const food = entry.foodId && (state.foods || []).find(f => f.id === entry.foodId);
  const [meal, setMeal] = useState(entry.meal);
  const [vals, setVals] = useState({ kcal: entry.kcal, protein: entry.protein, carbs: entry.carbs, fat: entry.fat, name: entry.name });
  return (
    <Sheet title="Edit entry" onClose={() => onClose()} footer={<button className="btn danger" onClick={() => { actions.removeEntry(entry.id); onClose('Deleted', () => actions.restoreEntry(entry)); }}>{Ic.trash} Delete</button>}>
      {food && entry.grams
        ? <PortionPicker food={food} initialGrams={entry.grams} meal={meal} setMeal={setMeal} addLabel="Save" onAdd={(g, m) => { actions.updateEntry({ ...entry, meal, grams: g, ...m }); onClose('Saved'); }}/>
        : <div className="stack gap12">
            <Field label="Name"><input className="input" value={vals.name} onChange={e => setVals({...vals, name: e.target.value})}/></Field>
            <div className="row gap8">
              {['kcal','protein','carbs','fat'].map(k => <Field key={k} label={k === 'kcal' ? 'kcal' : k[0].toUpperCase() + k.slice(1) + ' g'}><input className="input num" inputMode="decimal" value={vals[k] ?? ''} onChange={e => setVals({...vals, [k]: e.target.value})}/></Field>)}
            </div>
            <Field label="Meal" group><Seg value={meal} onChange={setMeal} options={E.MEALS.map(k => [k, MEAL_LABEL[k]])}/></Field>
            <button className="btn primary" onClick={() => { actions.updateEntry({ ...entry, meal, name: vals.name, kcal: Math.round(parseFloat(vals.kcal) || 0), protein: r1(parseFloat(vals.protein)), carbs: r1(parseFloat(vals.carbs)), fat: r1(parseFloat(vals.fat)) }); onClose('Saved'); }}>Save</button>
          </div>}
    </Sheet>);
}

function WeighInSheet({ state, actions, onClose }) {
  const units = state.profile?.units || 'kg';
  const [date, setDate] = useState(E.today());
  const existing = (state.weights || []).find(w => w.date === date);
  const [kg, setKg] = useState(existing?.kg ?? E.currentWeight(state));
  const [fat, setFat] = useState(existing?.fatPct ? String(existing.fatPct) : '');
  return (
    <Sheet title="Log weight" onClose={() => onClose()}>
      <div className="stack gap16">
        <Field label="Weight" group><WeightInput kg={kg} units={units} onChange={setKg} autoFocus/></Field>
        <Field label="Body fat % (optional)" hint="If your scale shows it. Lets Tally base your burn on body composition (Me → Goal & body).">
          <input className="input num" inputMode="decimal" placeholder="e.g. 35.6" value={fat} onChange={e => setFat(e.target.value.replace(/[^\d.]/g, ''))}/></Field>
        <Field label="Date"><input className="input" type="date" value={date} max={E.today()} onChange={e => setDate(e.target.value)}/></Field>
        <p className="sub">For the cleanest trend, weigh in first thing in the morning after the toilet, before eating or drinking.</p>
        <button className="btn primary" disabled={!(kg > 25 && kg < 400)} onClick={() => { actions.logWeight(date, kg, parseFloat(fat) || null); onClose(existing ? 'Weight updated' : 'Weight logged'); }}>{existing ? 'Update' : 'Save'}</button>
      </div>
    </Sheet>);
}

/* Log or edit a workout. Calories are estimated from the activity and
   minutes (net of resting burn) and can be overwritten with a watch's figure. */
function ExerciseSheet({ state, actions, date, item, onClose }) {
  const kg = E.currentWeight(state) || 80;
  const [type, setType] = useState(item?.type || 'walk');
  const [mins, setMins] = useState(String(item?.minutes || 30));
  const [kcal, setKcal] = useState(item?.kcalEdited ? String(item.kcal) : '');
  const auto = E.exerciseKcal(type, mins, kg);
  const value = kcal !== '' ? Math.round(Number(kcal) || 0) : auto;
  const healthDay = (state.exercise || []).some(x => x.kind === 'health' && x.date === date && !x.deleted);
  const save = () => {
    actions.saveExercise({ ...(item || {}), id: item?.id || uid(), date, kind: 'workout', type, name: E.EXERCISES[type].label,
      minutes: Number(mins) || 0, kcal: value, kcalEdited: kcal !== '' });
    onClose(item ? 'Workout updated' : 'Workout logged');
  };
  return (
    <Sheet title={item ? 'Edit workout' : 'Log a workout'} onClose={() => onClose()}
      footer={item && <button className="btn danger" onClick={() => { actions.removeExercise(item); onClose(); }}>{Ic.trash} Delete</button>}>
      <div className="stack gap16">
        <div className="row gap6 wrap">{Object.entries(E.EXERCISES).map(([k, x]) =>
          <button key={k} className={'chip' + (type === k ? ' on' : '')} onClick={() => setType(k)}>{x.label}</button>)}</div>
        <div className="row gap10">
          <Field label="Minutes"><input className="input num" inputMode="numeric" value={mins} onChange={e => setMins(e.target.value.replace(/\D/g, ''))}/></Field>
          <Field label="Calories burned" hint={kcal === '' ? 'Estimated. Type your watch’s number to use that instead.' : 'Using your number.'}>
            <input className="input num" inputMode="numeric" placeholder={String(auto)} value={kcal} onChange={e => setKcal(e.target.value.replace(/\D/g, ''))}/></Field>
        </div>
        {healthDay && <p className="sub">Apple Health already sent today’s activity, which includes this workout, so it won’t be added twice.</p>}
        <button className="btn primary" disabled={!(Number(mins) > 0)} onClick={save}>{item ? 'Save' : 'Log'} · {fmtK(value)} kcal</button>
      </div>
    </Sheet>);
}

/* Sync keys + setup guide for the Apple Health Shortcut. */
function AppleHealthCard() {
  const [tokens, setTokens] = useState(null);
  const [fresh, setFresh] = useState(null);
  const [err, setErr] = useState('');
  const [copied, setCopied] = useState('');
  const url = location.origin + '/api/ingest';
  const load = () => api('/api/tokens').then(r => setTokens(r.tokens || [])).catch(e => setErr(e.message));
  useEffect(() => { load(); }, []);
  const copy = (what, text) => { navigator.clipboard?.writeText(text); setCopied(what); setTimeout(() => setCopied(''), 1500); };
  const create = async () => {
    setErr('');
    try { const r = await api('/api/tokens', { method: 'POST', body: { label: 'Apple Health Shortcut' } }); setFresh(r.token); load(); }
    catch (e) { setErr(e.message); }
  };
  const revoke = async (id) => {
    if (!confirm('Remove this sync key? A Shortcut using it will stop syncing.')) return;
    await api('/api/tokens?id=' + encodeURIComponent(id), { method: 'DELETE' }); load();
  };
  const synced = (tokens || []).map(t => t.last_used).filter(Boolean).sort().pop();
  return (
    <div className="card pad stack gap12">
      <div className="row gap10"><span style={{color:'var(--danger)',width:22,height:22}}>{Ic.heart}</span><h2>Apple Health</h2></div>
      <p className="sub">Web apps can’t read Apple Health directly; only native iPhone apps can. Instead, a Shortcut on your iPhone sends Tally your active calories, steps, weight and body fat every evening. It takes about five minutes to set up, once.</p>
      {synced && <div className="sub">Last sync: <b style={{color:'var(--text-primary)'}}>{new Date(synced).toLocaleString('en-GB', { weekday:'short', hour:'2-digit', minute:'2-digit', day:'numeric', month:'short' })}</b></div>}
      {fresh && <div className="card pad stack gap8" style={{background:'var(--bg-surface-2)'}}>
        <div style={{fontWeight:700}}>Your sync key</div>
        <div className="code" style={{fontSize:14,wordBreak:'break-all'}}>{fresh}</div>
        <button className="btn sm" onClick={() => copy('key', fresh)}>{copied === 'key' ? 'Copied' : 'Copy key'}</button>
        <div className="sub" style={{fontSize:13}}>Shown once. It can only send Health numbers to Tally. It can’t read your log or sign in.</div>
      </div>}
      {!fresh && <button className="btn" onClick={create}>{Ic.key} {tokens?.length ? 'Make another sync key' : 'Make a sync key'}</button>}
      {err && <div className="err">{err}</div>}
      <details>
        <summary>Set up the Shortcut</summary>
        <ol className="sub" style={{marginLeft:20,marginTop:10,lineHeight:1.55,display:'flex',flexDirection:'column',gap:8}}>
          <li>Open <b>Shortcuts</b>, tap <b>+</b> and name it <b>Tally sync</b>.</li>
          <li>Add <b>Find Health Samples</b>: type <b>Active Energy</b>, filter <b>Start Date is Today</b>. Then add <b>Calculate Statistics</b> set to <b>Sum</b>. If you wear an Apple Watch, also filter <b>Source is</b> your watch, so iPhone and Watch aren’t counted twice.</li>
          <li>Add <b>Find Health Samples</b>: type <b>Steps</b>, <b>Start Date is Today</b>, then <b>Calculate Statistics</b> set to <b>Sum</b>.</li>
          <li>Add <b>Find Health Samples</b>: type <b>Weight</b>, sort by <b>Start Date</b>, <b>Latest First</b>, limit <b>1</b>. Add another for <b>Body Fat Percentage</b> the same way.</li>
          <li>Add <b>Format Date</b>: <b>Current Date</b>, format <b>Custom</b>, <b>yyyy-MM-dd</b>.</li>
          <li>Add <b>Get Contents of URL</b>. URL: <span className="num" style={{wordBreak:'break-all',color:'var(--text-primary)'}}>{url}</span> <button className="btn ghost sm" style={{height:24,padding:'0 6px'}} onClick={() => copy('url', url)}>{copied === 'url' ? 'Copied' : 'Copy'}</button><br/>
            Method <b>POST</b>. Header <b>Authorization</b> = <b>Bearer</b> followed by a space and your sync key. Request Body <b>JSON</b> with:
            <b> date</b> → Formatted Date, <b>activeKcal</b> → first Statistics, <b>steps</b> → second Statistics, <b>weight</b> → Weight sample, <b>bodyFat</b> → Body Fat sample.</li>
          <li>Tap ▶︎ once and allow Health access. You should see <b className="num">"ok": true</b>.</li>
          <li>In the <b>Automation</b> tab, tap <b>+</b> → <b>Time of Day</b> → <b>21:30</b>, <b>Daily</b>, <b>Run Immediately</b>, then choose <b>Tally sync</b>. Add a second automation at lunchtime if you want daytime updates.</li>
        </ol>
        <p className="sub" style={{marginTop:10}}>Running it again on the same day replaces that day’s numbers. Nothing is ever counted twice.</p>
      </details>
      {(tokens || []).map(t => <div key={t.id} className="row gap10">
        <span style={{width:20,height:20,color:'var(--accent)'}}>{Ic.key}</span>
        <div className="grow"><div style={{fontWeight:600}}><span className="num">{t.prefix}…</span> {t.label}</div>
          <div className="muted" style={{fontSize:12}}>Made {new Date(t.created_at).toLocaleDateString('en-GB')} · {t.last_used ? 'last used ' + new Date(t.last_used).toLocaleDateString('en-GB') : 'not used yet'}</div></div>
        <button className="icon-btn" aria-label="Remove sync key" onClick={() => revoke(t.id)}>{Ic.trash}</button>
      </div>)}
    </div>);
}

/* ── views ── */
function TodayView({ state, actions, date, setDate, open }) {
  const t = E.targets(state, date);
  const day = E.dayTotals(state.entries, date);
  const hasWeightToday = (state.weights || []).some(w => w.date === E.today());
  const top = E.insights(state).find(i => i.level === 'danger' || i.level === 'warn');
  return (
    <div className="stack gap16">
      {/* Large title, iOS style: the day on the left, glass day-stepper on the right. */}
      <div className="row between" style={{alignItems:'flex-end'}}>
        <div>
          <div className="label" style={{textTransform:'none',fontSize:15}}>{E.parseIso(date).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>
          <h1>{prettyDate(date)}</h1>
        </div>
        <div className="row gap8">
          {date !== E.today() && <button className="btn sm" onClick={() => setDate(E.today())}>Today</button>}
          <button className="icon-btn" aria-label="Previous day" onClick={() => setDate(E.addDays(date, -1))}>{Ic.left}</button>
          <button className="icon-btn" aria-label="Next day" disabled={date >= E.today()} style={{opacity: date >= E.today() ? .35 : 1}} onClick={() => date < E.today() && setDate(E.addDays(date, 1))}>{Ic.right}</button>
        </div>
      </div>

      <div className="card pad stack gap16">
        <Ring eaten={day.kcal} target={t.kcal} bonus={t.exerciseBonus}/>
        <div className="row gap12">
          <MacroBar label="Protein" value={day.protein} target={t.protein} color="var(--protein)"/>
          <MacroBar label="Carbs" value={day.carbs} target={t.carbs} color="var(--carbs)"/>
          <MacroBar label="Fat" value={day.fat} target={t.fat} color="var(--fat)"/>
        </div>
      </div>

      <div className="actions">
        <button className="action" onClick={() => open('add', { tab: 'barcode' })}><span className="ico">{Ic.barcode}</span>Scan</button>
        <button className="action" onClick={() => open('add', { tab: 'receipt' })}><span className="ico">{Ic.receipt}</span>Receipt</button>
        <button className="action" onClick={() => open('add', { tab: 'search' })}><span className="ico">{Ic.search}</span>Search</button>
        <button className="action" onClick={() => open('add', { tab: 'quick' })}><span className="ico">{Ic.bolt}</span>Quick add</button>
      </div>

      {date === E.today() && !hasWeightToday && <button className="card pad row gap12" style={{cursor:'pointer',textAlign:'left'}} onClick={() => open('weigh')}>
        <span className="action" style={{padding:0,background:'none'}}><span className="ico">{Ic.scale}</span></span><div className="grow"><div style={{fontWeight:700}}>Weigh in today</div><div className="sub">Daily readings make your trend and pace checks more accurate.</div></div>{Ic.right}
      </button>}

      {top && <button className="card insight" style={{'--c': LEVEL[top.level].c, textAlign:'left', cursor:'pointer'}} onClick={() => open('view', 'insights')}>
        <div className="tag">{LEVEL[top.level].icon}{LEVEL[top.level].label}</div>
        <div style={{fontWeight:700,marginTop:6}}>{top.title}</div>
        <div className="sub" style={{marginTop:4}}>{top.body}</div>
      </button>}

      {E.MEALS.map(m => {
        const meal = day.byMeal[m];
        return (
          <div key={m} className="card pad">
            <div className="row between">
              <div><h2>{MEAL_LABEL[m]}</h2>{meal.items.length > 0 && <div className="sub num">{fmtK(meal.kcal)} kcal · P {Math.round(meal.protein)} · C {Math.round(meal.carbs)} · F {Math.round(meal.fat)}</div>}</div>
              <button className="btn sm" onClick={() => open('add', { meal: m })}>{Ic.plus} Add</button>
            </div>
            {meal.items.length > 0 && <div className="stack" style={{marginTop:8}}>
              {meal.items.map(e => (
                <div key={e.id} className="list-row" onClick={() => open('entry', e)}>
                  <div className="grow"><div className="name">{e.name}</div><div className="meta">{[e.brand, e.grams ? `${Math.round(e.grams)} ${(state.foods||[]).find(f=>f.id===e.foodId)?.unit || 'g'}` : e.qtyLabel, e.estimate ? 'estimate' : null, e.source?.startsWith('import') ? 'imported' : null].filter(Boolean).join(' · ')}</div></div>
                  <div className="num" style={{fontWeight:700}}>{fmtK(e.kcal)}</div>
                </div>))}
            </div>}
          </div>);
      })}

      {(() => {
        const ex = t.exercise;
        const h = ex.health;
        return (
          <div className="card pad">
            <div className="row between">
              <div><h2>Exercise</h2>
                <div className="sub num">{ex.credit > 0
                  ? (t.eatBack > 0 ? `${fmtK(ex.credit)} kcal burned · +${fmtK(t.exerciseBonus)} to eat` : `${fmtK(ex.credit)} kcal burned · not added (Me → Exercise)`)
                  : 'Workouts add calories to your day'}</div></div>
              <button className="btn sm" onClick={() => open('exercise', null)}>{Ic.plus} Add</button>
            </div>
            {(h || ex.manual.length > 0) && <div className="stack" style={{marginTop:8}}>
              {h && <div className="list-row" style={{cursor:'default'}}>
                <span style={{width:22,height:22,color:'var(--danger)'}}>{Ic.heart}</span>
                <div className="grow"><div className="name">Apple Health</div>
                  <div className="meta" style={{whiteSpace:'normal'}}>{[h.steps != null ? `${fmtK(h.steps)} steps` : null, h.activeKcal != null ? `${fmtK(h.activeKcal)} active kcal` : null, ex.baseline ? (ex.source === 'steps' ? `first ${fmtK(ex.baseline)} steps already in your activity level` : `first ${fmtK(ex.baseline)} already in your activity level`) : null].filter(Boolean).join(' · ')}</div></div>
                <div className="num" style={{fontWeight:700}}>+{fmtK(ex.credit)}</div>
              </div>}
              {ex.manual.map(x => <div key={x.id} className="list-row" onClick={() => open('exercise', x)}>
                <span style={{width:22,height:22,color:'var(--accent)'}}>{Ic.run}</span>
                <div className="grow"><div className="name">{x.name}</div><div className="meta">{[`${x.minutes} min`, ex.source !== 'manual' ? 'counted by Apple Health' : null].filter(Boolean).join(' · ')}</div></div>
                <div className="num" style={{fontWeight:700,opacity: ex.source !== 'manual' ? .45 : 1}}>{fmtK(x.kcal)}</div>
              </div>)}
            </div>}
          </div>);
      })()}
    </div>);
}

function ProgressView({ state, actions, open }) {
  const units = state.profile?.units || 'kg';
  const [range, setRange] = useState(90);
  const series = E.trendSeries(state.weights);
  const rate = E.weightRate(state.weights, E.today(), 28);
  const t = E.targets(state);
  const cur = series.length ? series[series.length - 1].trend : state.profile?.startKg;
  const first = E.sortedWeights(state.weights)[0];
  const lost = first && cur ? first.kg - cur : null;
  const lossWk = rate ? -rate.kgPerWeek : null;
  const proj = E.projection(cur, state.profile?.goalKg, lossWk && lossWk > 0.05 ? lossWk : t.plannedPaceKg);
  const history = [...E.sortedWeights(state.weights)].reverse();
  const [showAll, setShowAll] = useState(false);
  return (
    <div className="stack gap16">
      <div className="row between"><h1>Progress</h1><button className="btn primary sm" onClick={() => open('weigh')}>{Ic.scale} Log weight</button></div>
      <div className="tiles">
        <div className="tile"><div className="label">Trend weight</div><div className="v num">{E.fmtWeight(cur, units)}</div><div className="d">Smoothed daily</div></div>
        <div className="tile"><div className="label">Weekly pace</div><div className="v num">{lossWk == null ? '—' : E.fmtWeight(-lossWk, units, { signed: true })}</div><div className="d">{rate ? `${cur ? Math.abs(lossWk / cur * 100).toFixed(1) : '—'}% per week` : 'Needs ~2 weeks'}</div></div>
        <div className="tile"><div className="label">Lost so far</div><div className="v num">{lost == null ? '—' : E.fmtWeight(lost, units)}</div><div className="d">{first ? `Since ${shortDate(first.date)}` : '—'}</div></div>
        <div className="tile"><div className="label">Goal</div><div className="v num">{proj ? E.parseIso(proj.date).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : t.atGoal ? 'Reached' : '—'}</div><div className="d">{E.fmtWeight(state.profile?.goalKg, units)}{proj ? ` · ${Math.round(proj.weeks)} wks` : ''}</div></div>
      </div>
      <div className="card pad stack gap12">
        <div className="row between wrap gap8"><h2>Weight timeline</h2>
          <div className="row gap6">{[[30,'1M'],[90,'3M'],[180,'6M'],[365,'1Y'],[0,'All']].map(([d, l]) => <button key={l} className={'chip' + (range === d ? ' on' : '')} onClick={() => setRange(d)}>{l}</button>)}</div>
        </div>
        <WeightChart weights={state.weights} units={units} goalKg={state.profile?.goalKg} rangeDays={range} rate={rate}/>
      </div>
      <div className="card pad stack gap12">
        <div className="row between"><h2>Calories, last 14 days</h2><span className="sub num">Target {fmtK(t.kcal)}</span></div>
        <CalorieChart entries={state.entries} target={t.kcal}/>
      </div>
      <div className="card pad">
        <h2 style={{marginBottom:6}}>Weigh-ins</h2>
        {!history.length && <div className="sub">No weigh-ins yet.</div>}
        {(showAll ? history : history.slice(0, 10)).map(w => (
          <div key={w.id} className="list-row" style={{cursor:'default'}}>
            <div className="grow"><div className="name">{prettyDate(w.date, { long: true })}</div>{w.source?.startsWith('import') && <div className="meta">imported</div>}</div>
            <div className="num" style={{fontWeight:700}}>{E.fmtWeight(w.kg, units)}</div>
            <button className="icon-btn" aria-label={`Delete weigh-in on ${w.date}`} onClick={() => actions.removeWeight(w)}>{Ic.trash}</button>
          </div>))}
        {history.length > 10 && <button className="btn ghost sm" onClick={() => setShowAll(!showAll)}>{showAll ? 'Show fewer' : `Show all ${history.length}`}</button>}
      </div>
    </div>);
}

          ['Maintenance (formula)', `${fmtK(t.est.formula)} kcal`],
          ['Maintenance (from your data)', t.est.observed ? `${fmtK(t.est.observed)} kcal` : `after 2 weeks of logging (${t.est.loggedDays}/14 days)`],
          ['Maintenance used', `${fmtK(t.tdee)} kcal`],
          ['Daily target', `${fmtK(t.kcalBase)} kcal${state.profile?.override?.kcal ? ' (custom)' : ''}`],

          ['Daily deficit', t.deficit != null ? `${fmtK(t.deficit)} kcal (${Math.round((t.deficitPct || 0) * 100)}%)` : '—'],

        ].map(([k, v]) => <div key={k} className="row between" style={{fontSize:14}}><span className="sub">{k}</span><span className="num" style={{fontWeight:600,textAlign:'right'}}>{v}</span></div>)}
      </div>
      <p className="muted" style={{fontSize:12,lineHeight:1.5}}>Tally gives general information, not medical advice. If you’re pregnant, breastfeeding, under 18, have diabetes, an eating disorder or another medical condition, talk to your GP before starting a calorie deficit.</p>
    </div>);
}

/* ── import ── */
function ImportSheet({ state, actions, onClose }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState(0);
  const [sources, setSources] = useState(null);
  const [include, setInclude] = useState({});
  const [skipLogged, setSkipLogged] = useState(true);
  const [err, setErr] = useState('');
  const units = state.profile?.units || 'kg';
  const pick = async (files) => {
    if (!files?.length) return;
    setErr(''); setBusy(true); setProgress(0);
    try {
      const res = await IMP.analyse([...files], { weightUnit: null, onProgress: setProgress });
      const useful = res.sources.filter(s => s.entries?.length || s.weights?.length || s.kind === 'generic');
      if (!useful.length) throw new Error('Couldn’t find any food or weight data in that file.');
      setSources(useful);
      setInclude(Object.fromEntries(useful.map((s, i) => [i, !!(s.entries?.length || s.weights?.length)])));
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const reparse = (i, opts) => setSources(ss => ss.map((s, j) => j === i ? IMP.reparse(s, { map: s.columns, weightUnit: s.weightUnit, dateOrder: s.dateOrder, ...opts }) : s));
  const loggedDates = useMemo(() => new Set((state.entries || []).filter(e => !e.source?.startsWith('import')).map(e => e.date)), [state.entries]);
  const plan = useMemo(() => {
    if (!sources) return null;
    let entries = [], weights = [];
    sources.forEach((s, i) => { if (include[i]) { entries = entries.concat(s.entries || []); weights = weights.concat(s.weights || []); } });
    const skipped = skipLogged ? entries.filter(e => loggedDates.has(e.date)).length : 0;
    if (skipLogged) entries = entries.filter(e => !loggedDates.has(e.date));
    return { entries, weights, skipped };
  }, [sources, include, skipLogged, loggedDates]);
  const range = (s) => {
    const ds = [...(s.entries || []), ...(s.weights || [])].map(x => x.date).sort();
    return ds.length ? `${shortDate(ds[0])} ${ds[0].slice(0,4)} – ${shortDate(ds[ds.length-1])} ${ds[ds.length-1].slice(0,4)}` : '';
  };
  return (
    <Sheet title="Import from other apps" onClose={() => onClose()} wide
      footer={sources && <><button className="btn" onClick={() => setSources(null)}>Start over</button>
        <button className="btn primary grow" disabled={!plan.entries.length && !plan.weights.length} onClick={() => { actions.importData(plan); onClose(`Imported ${plan.entries.length.toLocaleString()} food entries and ${plan.weights.length.toLocaleString()} weigh-ins`); }}>
          Import {plan.entries.length.toLocaleString()} entries · {plan.weights.length.toLocaleString()} weigh-ins</button></>}>
      {!sources ? <div className="stack gap16">
        <div className="stack gap10">
          {[
            ['MyFitnessPal', 'Website → Settings → Export Data (Premium), or ask for your data at Settings → Privacy Center. Upload the ZIP you get by email.'],
            ['Lose It!', 'Website → Settings → Export my data. Upload the ZIP.'],
            ['Cronometer', 'Settings → Account → Export data. Upload the servings, daily summary and/or biometrics CSVs.'],
            ['Apple Health', 'Health app → your picture → Export All Health Data. Upload export.zip. Picks up weight and calories from any app that writes to Health.'],
            ['Anything else', 'Any CSV with a date column plus calories and/or weight, from Fitbit, Samsung Health, Google Fit, Happy Scale, Libra or a spreadsheet. You can fix the columns before importing.'],
          ].map(([h, d]) => <div key={h}><div style={{fontWeight:700}}>{h}</div><div className="sub">{d}</div></div>)}
        </div>
        <label className="btn primary block" style={{cursor:'pointer'}}>{Ic.upload} Choose files
          <input type="file" multiple accept=".csv,.zip,.xml,text/csv,application/zip" hidden onChange={e => pick(e.target.files)}/></label>
        {busy && <div className="row gap10"><span className="spinner"/>Reading… {progress ? Math.round(progress * 100) + '%' : ''}</div>}
        {err && <div className="err">{err}</div>}
        <p className="muted" style={{fontSize:12}}>Files are read on this device. Re-importing the same export updates instead of duplicating.</p>
      </div> : <div className="stack gap12">
        {sources.map((s, i) => (
          <div key={i} className="card pad stack gap10" style={{background:'var(--bg-surface-2)'}}>
            <label className="row gap10" style={{cursor:'pointer'}}>
              <input type="checkbox" className="check" checked={!!include[i]} onChange={e => setInclude({ ...include, [i]: e.target.checked })}/>
              <div className="grow"><div style={{fontWeight:700}}>{s.label || s.name}</div>
                <div className="sub">{[s.entries?.length ? `${s.entries.length.toLocaleString()} food entries` : null, s.weights?.length ? `${s.weights.length.toLocaleString()} weigh-ins` : null].filter(Boolean).join(' · ') || 'Nothing recognised yet'}{range(s) ? ` · ${range(s)}` : ''}</div></div>
            </label>
            {(s.notes || []).map((n, k) => <div key={k} className="sub">{n}</div>)}
            {(s.kind === 'mfp-measurement' || (s.kind === 'generic' && s.columns?.weight)) && <Field label="Weights in this file are in" group>
              <Seg value={s.weightUnit || 'kg'} onChange={u => reparse(i, { weightUnit: u })} options={[['kg','kg'],['lb','lb'],['st','stone']]}/></Field>}
            {s.weights?.length > 0 && <div className="sub">Latest: {E.fmtWeight(s.weights.reduce((a, b) => a.date > b.date ? a : b).kg, units)}. Check this looks right.</div>}
            {s.kind === 'generic' && s.headers && <details><summary className="sub" style={{cursor:'pointer'}}>Columns</summary>
              <div className="row gap8 wrap" style={{marginTop:10}}>
                {['date','kcal','protein','carbs','fat','weight','meal','name'].map(k => <label key={k} className="field" style={{minWidth:130,flex:1}}><span>{k === 'kcal' ? 'Calories' : k[0].toUpperCase() + k.slice(1)}</span>
                  <select className="select" value={s.columns?.[k] || ''} onChange={e => reparse(i, { map: { ...s.columns, [k]: e.target.value || null } })}>
                    <option value="">—</option>{s.headers.map(h => <option key={h} value={h}>{h}</option>)}</select></label>)}
                <Field label="Dates are" group><Seg value={s.dateOrder || 'dmy'} onChange={d => reparse(i, { dateOrder: d })} options={[['dmy','day/month'],['mdy','month/day']]}/></Field>
              </div></details>}
          </div>))}
        <label className="row gap10" style={{cursor:'pointer'}}><input type="checkbox" className="check" checked={skipLogged} onChange={e => setSkipLogged(e.target.checked)}/>
          <span className="sub">Skip days I’ve already logged in Tally{plan.skipped ? ` (${plan.skipped.toLocaleString()} entries)` : ''}, so nothing is counted twice</span></label>
      </div>}
    </Sheet>);
}

function AppVersionCard() {
  const [status, setStatus] = useState('');
  const d = buildDate(APP_BUILD);
  return (
    <div className="card pad stack gap12">
      <h2>App</h2>
      <div className="row between"><span className="sub">Version</span>
        <span className="num" style={{fontWeight:600}}>{d ? d.toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : 'development'}</span></div>
      <p className="sub">Tally updates itself. New versions install in the background and switch over the next time you’re not mid-entry.</p>
      <div className="row gap10">
        <button className="btn grow" onClick={async () => { setStatus('checking'); const newer = await Updates.check(); setStatus(newer ? 'updating' : 'latest'); }}>
          {status === 'checking' ? <span className="spinner"/> : 'Check for updates'}</button>
        <button className="btn grow" onClick={() => { if (confirm('Repair the app? This clears the cached copy of Tally and reloads it. Your data isn’t affected.')) Updates.repair(); }}>Repair app</button>

function MeView({ state, actions, account, refreshAccount, theme, setTheme, open, signOut }) {
  const p = state.profile || {};
  const units = p.units || 'kg';
  const [draft, setDraft] = useState(p);
  useEffect(() => setDraft(state.profile || {}), [state.profile?.updated]);
  const dirty = JSON.stringify(draft) !== JSON.stringify(p);
  const set = (k, v) => setDraft(o => ({ ...o, [k]: v }));
  const t = E.targets({ ...state, profile: draft });
  const [pk, setPk] = useState({ busy: false, msg: '' });
  const [pw, setPw] = useState(null);
  const [del, setDel] = useState(null);
  const fileRef = useRef(null);

  const addPasskey = async () => {
    setPk({ busy: true, msg: '' });
    try { await registerPasskey(); setPk({ busy: false, msg: 'Passkey added.' }); refreshAccount(); }
    catch (e) { setPk({ busy: false, msg: e.name === 'NotAllowedError' ? 'Cancelled.' : e.name === 'InvalidStateError' ? 'This device already has a passkey for Tally.' : e.message }); }
  };
  const exportJson = () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tally-backup-${E.today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const restore = async (file) => {
    try { const data = JSON.parse(await file.text()); if (!data || !Array.isArray(data.entries)) throw new Error(); actions.restoreBackup(data); }
    catch { alert('That isn’t a Tally backup file.'); }
  };

  return (
    <div className="stack gap16">
      <h1>Me</h1>

      <div className="card pad stack gap16">
        <h2>Goal & body</h2>
        <Field label="Units" group><Seg value={draft.units || 'kg'} onChange={v => set('units', v)} options={[['kg','kg'],['st','st & lb'],['lb','lb']]}/></Field>
        <div className="row gap10">
          <Field label="Goal weight" group><WeightInput kg={draft.goalKg} units={draft.units || 'kg'} onChange={v => set('goalKg', v)}/></Field>
        </div>
        <Field label="Pace"><select className="select" value={String(draft.paceKg ?? 0.5)} onChange={e => set('paceKg', Number(e.target.value))}>
          {E.PACES.map(pc => <option key={pc.id} value={String(pc.kg)}>{pc.label} · {E.fmtWeight(pc.kg, draft.units || 'kg')} a week</option>)}
          <option value="0">Maintain my weight</option>
        </select></Field>
        <Field label="Day-to-day activity" hint="Your normal day, not counting workouts. Log those as exercise or sync Apple Health."><select className="select" value={draft.activity || 'light'} onChange={e => set('activity', e.target.value)}>{Object.entries(E.ACTIVITY).map(([k, a]) => <option key={k} value={k}>{a.label} — {a.hint}</option>)}</select></Field>
        <div className="row gap10">
          <Field label="Height" group><HeightInput cm={draft.heightCm} unit={heightUnitFor(draft)} onChange={v => set('heightCm', v)} onUnitChange={u => set('heightUnit', u)}/></Field>
        </div>
        <div className="row gap10">
          <Field label="Year of birth"><input className="input num" inputMode="numeric" value={draft.birthYear || ''} onChange={e => set('birthYear', Number(e.target.value.replace(/\D/g,'').slice(0,4)) || '')}/></Field>
          <Field label="Sex"><select className="select" value={draft.sex || 'female'} onChange={e => set('sex', e.target.value)}><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></Field>
        </div>
        {(() => {
          const kgNow = E.currentWeight(state);
          const fatNow = E.bodyFat({ ...state, profile: draft });
          const standard = E.bmr(draft, kgNow);
          const lean = E.katch(kgNow, fatNow);
          return <>
            <Field label="Body fat %" hint={E.bodyFat({ ...state, profile: {} }) ? `Latest reading ${E.bodyFat({ ...state, profile: {} })}%, from your weigh-ins or Apple Health.` : 'Optional. From a smart scale; Apple Health keeps it updated.'}>
              <input className="input num" inputMode="decimal" placeholder="e.g. 35.6" value={draft.bodyFatPct || ''} onChange={e => set('bodyFatPct', parseFloat(e.target.value.replace(/[^\d.]/g, '')) || null)}/></Field>
            {fatNow && standard && lean && <Field label="Work out resting burn from" group>
              <Seg value={draft.bmrMethod === 'bodyfat' ? 'bodyfat' : 'formula'} onChange={v => set('bmrMethod', v)} options={[['formula', `Standard · ${fmtK(standard)}`], ['bodyfat', `Body fat · ${fmtK(lean)}`]]}/>
              <small className="muted" style={{fontSize:12}}>The standard formula (also used by MyFitnessPal) uses height, weight, age and sex. “Body fat” uses your lean mass, like a smart scale’s BMR. It’s more accurate when your body fat or muscle is well above or below average.</small>
            </Field>}
          </>;
        })()}
        <details>
          <summary>Custom targets {draft.override && Object.values(draft.override).some(Boolean) ? '(on)' : ''}</summary>
          <div className="stack gap10" style={{marginTop:12}}>
            <p className="sub">Leave blank to let Tally work them out. Suggested: {fmtK(E.targets({ ...state, profile: { ...draft, override: {} } }).kcal)} kcal.</p>
            <div className="row gap8">
              {['kcal','protein','carbs','fat'].map(k => <Field key={k} label={k === 'kcal' ? 'kcal' : k[0].toUpperCase() + k.slice(1) + ' g'}>
                <input className="input num" inputMode="numeric" value={draft.override?.[k] || ''} onChange={e => set('override', { ...(draft.override || {}), [k]: Number(e.target.value.replace(/\D/g,'')) || null })}/></Field>)}
            </div>
          </div>
        </details>
        <div className="row between" style={{fontSize:14}}><span className="sub">Daily target</span><b className="num">{fmtK(t.kcal)} kcal · P {t.protein} · C {t.carbs} · F {t.fat}</b></div>
        {dirty && <button className="btn primary" onClick={() => actions.saveProfile(draft)}>Save changes</button>}
      </div>

      <div className="card pad stack gap12">
        <h2>Exercise</h2>

      <AppleHealthCard/>

        <h2>Import & backup</h2>
        <button className="btn" onClick={() => open('import')}>{Ic.upload} Import from MyFitnessPal and other apps</button>
        <div className="row gap10">
          <button className="btn grow" onClick={exportJson}>{Ic.download} Download backup</button>
          <button className="btn grow" onClick={() => fileRef.current.click()}>Restore backup</button>
          <input ref={fileRef} type="file" accept="application/json,.json" hidden onChange={e => e.target.files[0] && restore(e.target.files[0])}/>

        {pk.msg && <div className="sub">{pk.msg}</div>}
