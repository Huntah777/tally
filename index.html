<style>
/* ════════════════════════════════════════════════════════════════
   Tally follows iOS 26 ("Liquid Glass"):
   • Apple system colours and SF Pro (system-ui), so on an iPhone it reads
     as a native app; elsewhere it falls back to the platform font.
   • Grouped-inset surfaces with no borders, large titles, capsule
     buttons and segmented controls.
   • Chrome (tab bar, sheets, toasts, tooltips) is glass: a translucent,
     blurred, specular-edged layer floating above content.
   Dark by default, light theme, and "Auto" (no data-theme) following
   the OS. Reduce Transparency swaps glass for solid fills.
   ════════════════════════════════════════════════════════════════ */
:root{
  --bg-app:#000000; --bg-sidebar:#0b0b0c; --bg-surface:#1c1c1e; --bg-surface-2:#2c2c2e; --bg-elev:#2c2c2e; --seg-on:#636366;
  --sep:rgba(84,84,88,.55); --border:rgba(84,84,88,.4); --border-strong:rgba(120,120,128,.5);
  --text-primary:#ffffff; --text-secondary:rgba(235,235,245,.62); --text-muted:rgba(235,235,245,.34);
  --accent:#30d158; --accent-strong:#28b84c; --accent-ink:#000000; --accent-soft:rgba(48,209,88,.18); --accent-ring:rgba(48,209,88,.4);
  --tint:#0a84ff;
  --good:#30d158; --warning:#ff9f0a; --danger:#ff453a; --info:#64d2ff;
  --protein:#0a84ff; --carbs:#bf5af2; --fat:#ffd60a;
  --fill:rgba(120,120,128,.24); --fill-hover:rgba(120,120,128,.3); --fill-active:rgba(120,120,128,.36); --fill-input:rgba(118,118,128,.24);
  --glass-bg:rgba(30,30,32,.58); --glass-bg-strong:rgba(28,28,30,.84);
  --glass-edge:rgba(255,255,255,.16); --glass-shine:rgba(255,255,255,.22);
  --glass-blur:blur(28px) saturate(1.9);
  --shadow-2:0 18px 50px -12px rgba(0,0,0,.65); --shadow-glass:0 10px 30px -8px rgba(0,0,0,.55);
  --r-sm:10px; --r-md:14px; --r-lg:22px; --r-xl:34px; --r-pill:999px;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.4,.64,1); --dur:220ms;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg-app:#f2f2f7; --bg-sidebar:#f2f2f7; --bg-surface:#ffffff; --bg-surface-2:#f2f2f7; --bg-elev:#ffffff; --seg-on:#ffffff;
  --sep:rgba(60,60,67,.22); --border:rgba(60,60,67,.18); --border-strong:rgba(60,60,67,.29);
  --text-primary:#000000; --text-secondary:rgba(60,60,67,.66); --text-muted:rgba(60,60,67,.36);
  --accent:#34c759; --accent-strong:#2fb350; --accent-ink:#ffffff; --accent-soft:rgba(52,199,89,.14); --accent-ring:rgba(52,199,89,.38);
  --tint:#007aff;
  --good:#248a3d; --warning:#c93400; --danger:#d70015; --info:#0071a4;
  --protein:#007aff; --carbs:#af52de; --fat:#d4a000;
  --fill:rgba(120,120,128,.12); --fill-hover:rgba(120,120,128,.18); --fill-active:rgba(120,120,128,.24); --fill-input:rgba(118,118,128,.12);
  --glass-bg:rgba(255,255,255,.62); --glass-bg-strong:rgba(255,255,255,.86);
  --glass-edge:rgba(255,255,255,.75); --glass-shine:rgba(255,255,255,.95);
  --shadow-2:0 18px 50px -14px rgba(0,0,0,.22); --shadow-glass:0 8px 28px -8px rgba(0,0,0,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){
    --bg-app:#f2f2f7; --bg-sidebar:#f2f2f7; --bg-surface:#ffffff; --bg-surface-2:#f2f2f7; --bg-elev:#ffffff; --seg-on:#ffffff;
    --sep:rgba(60,60,67,.22); --border:rgba(60,60,67,.18); --border-strong:rgba(60,60,67,.29);
    --text-primary:#000000; --text-secondary:rgba(60,60,67,.66); --text-muted:rgba(60,60,67,.36);
    --accent:#34c759; --accent-strong:#2fb350; --accent-ink:#ffffff; --accent-soft:rgba(52,199,89,.14); --accent-ring:rgba(52,199,89,.38);
    --tint:#007aff;
    --good:#248a3d; --warning:#c93400; --danger:#d70015; --info:#0071a4;
    --protein:#007aff; --carbs:#af52de; --fat:#d4a000;
    --fill:rgba(120,120,128,.12); --fill-hover:rgba(120,120,128,.18); --fill-active:rgba(120,120,128,.24); --fill-input:rgba(118,118,128,.12);
    --glass-bg:rgba(255,255,255,.62); --glass-bg-strong:rgba(255,255,255,.86);
    --glass-edge:rgba(255,255,255,.75); --glass-shine:rgba(255,255,255,.95);
    --shadow-2:0 18px 50px -14px rgba(0,0,0,.22); --shadow-glass:0 8px 28px -8px rgba(0,0,0,.18);
    color-scheme:light;
  }
}
@media (prefers-reduced-transparency:reduce){ :root{ --glass-bg:var(--bg-elev); --glass-bg-strong:var(--bg-elev); --glass-blur:none; } }
@media (prefers-reduced-motion:reduce){ *{animation-duration:1ms!important;transition-duration:1ms!important} }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-app);color:var(--text-primary);font-family:var(--font);font-size:17px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none}
.num{font-family:var(--font-round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{height:100%}

/* glass material: tint + blur + a bright top edge (specular highlight) */
.glass{background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:var(--shadow-glass),inset 0 1px 0 var(--glass-shine),inset 0 0 0 .5px var(--glass-edge)}

/* layout */
.shell{display:flex;height:100%;overflow:hidden}
.sidebar{width:240px;min-width:240px;background:var(--bg-sidebar);display:flex;flex-direction:column;padding:20px 12px;gap:2px}
.main{flex:1;min-width:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.page{max-width:720px;margin:0 auto;padding:30px 24px 120px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand img{width:28px;height:28px;border-radius:7px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-sm);font-size:15px;font-weight:600;color:var(--text-primary);cursor:pointer;border:none;background:none;text-align:left;width:100%;transition:background var(--dur) var(--ease)}
.nav-item svg{width:20px;height:20px;color:var(--accent)}
.nav-item:hover{background:var(--fill)}
.nav-item.active{background:var(--accent);color:var(--accent-ink)}
.nav-item.active svg{color:var(--accent-ink)}
.tabbar,.tab-fab{display:none}

@media (max-width:768px){
  .sidebar{display:none}
  .page{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(120px + env(safe-area-inset-bottom,0px))}
  /* iOS 26 tab bar: a floating glass capsule, with the primary action in its
     own glass circle beside it rather than squeezed between the tabs. */
  .tabbar{display:flex;position:fixed;z-index:50;left:16px;right:88px;bottom:calc(max(env(safe-area-inset-bottom,0px),12px) + 4px);height:62px;padding:4px;border-radius:var(--r-pill);align-items:stretch}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--text-primary);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:var(--r-pill);transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform 160ms var(--spring)}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button.active{color:var(--accent);background:var(--fill)}
  .tabbar button:active{transform:scale(.92)}
  .tab-fab{display:flex;position:fixed;z-index:50;right:16px;bottom:calc(max(env(safe-area-inset-bottom,0px),12px) + 4px);width:62px;height:62px;border-radius:50%;border:none;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);transition:transform 180ms var(--spring)}
  .tab-fab svg{width:28px;height:28px;stroke-width:2.4}
  .tab-fab:active{transform:scale(.9)}
}

/* type, after iOS text styles */
h1{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
h2{font-size:20px;font-weight:700;letter-spacing:-.015em}
.sub{color:var(--text-secondary);font-size:15px;line-height:1.4}
.muted{color:var(--text-muted)}
.label{font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.02em}

/* surfaces: grouped inset, no borders, like Settings and Health */
.card{background:var(--bg-surface);border-radius:var(--r-lg);border:none}
.pad{padding:16px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.divider{height:.5px;background:var(--sep);margin:2px 0}

/* controls: capsules */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:var(--r-pill);border:none;background:var(--fill);color:var(--text-primary);font-weight:600;font-size:17px;cursor:pointer;transition:background var(--dur) var(--ease),transform 160ms var(--spring),opacity var(--dur);white-space:nowrap}
.btn:hover{background:var(--fill-hover)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:none;color:var(--tint)}
.btn.sm{height:34px;padding:0 14px;font-size:15px}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:none;background:var(--fill);color:var(--text-primary);cursor:pointer;flex-shrink:0;transition:transform 160ms var(--spring),background var(--dur)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.plain{background:none;color:var(--text-muted)}
.input,.select{width:100%;height:46px;padding:0 14px;border-radius:var(--r-md);border:none;background:var(--fill-input);outline:none;font-size:17px;transition:box-shadow var(--dur)}
.select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.input{height:auto;padding:12px 14px;line-height:1.45;font-size:15px}
.input:focus,.select:focus{box-shadow:0 0 0 3px var(--accent-ring)}
.input::placeholder{color:var(--text-muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.field>span{font-size:13px;font-weight:600;color:var(--text-secondary);padding-left:4px}
.seg{display:flex;background:var(--fill);border-radius:var(--r-pill);padding:3px}
.seg button{flex:1;height:34px;border:none;background:none;border-radius:var(--r-pill);font-weight:600;font-size:14px;color:var(--text-primary);cursor:pointer;white-space:nowrap;padding:0 8px;transition:background var(--dur) var(--ease)}
.seg button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.chip{height:32px;padding:0 13px;border-radius:var(--r-pill);border:none;background:var(--fill);font-size:14px;font-weight:600;color:var(--text-primary);cursor:pointer;transition:transform 160ms var(--spring)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.check{width:24px;height:24px;accent-color:var(--accent);flex-shrink:0}

/* quick actions, Control Center–style tiles */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 4px 14px;border-radius:var(--r-lg);border:none;background:var(--bg-surface);cursor:pointer;font-weight:600;font-size:13px;color:var(--text-primary);transition:transform 180ms var(--spring)}
.action:active{transform:scale(.94)}
.action .ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.action svg{width:22px;height:22px}

/* list rows with inset separators, like UITableView */
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer;position:relative}
.list-row+.list-row::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.list-row .name{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .meta{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row:active{opacity:.6}
.thumb{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--fill);flex-shrink:0}

/* progress bars */
.bar{height:6px;border-radius:var(--r-pill);background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);transition:width 500ms var(--ease)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}.actions{gap:8px}}
.tile{padding:14px 16px;border-radius:var(--r-lg);background:var(--bg-surface)}
.tile .v{font-size:24px;font-weight:700;margin-top:4px;font-family:var(--font-round);letter-spacing:-.02em}
.tile .d{font-size:13px;color:var(--text-secondary);margin-top:2px}

/* insights */
.insight{padding:16px 18px}
.insight .tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c)}
.insight .tag svg{width:18px;height:18px}
.insight ul{margin:10px 0 0 20px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--text-secondary);line-height:1.45}

/* sheets: iOS 26 inset glass panel with a grabber, springing up */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;padding:0 8px max(env(safe-area-inset-bottom,0px),8px);animation:fade 200ms var(--ease)}
@media (min-width:769px){.scrim{align-items:center;padding:24px}}
.sheet{width:100%;max-width:560px;max-height:calc(100vh - env(safe-area-inset-top,0px) - 24px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;border-radius:var(--r-xl);overflow:hidden;animation:rise 420ms var(--spring);
  background:var(--glass-bg-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow-2),inset 0 1px 0 var(--glass-shine),inset 0 0 0 .5px var(--glass-edge)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--text-muted);margin:7px auto 0;flex-shrink:0}
@media (min-width:769px){.grabber{display:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 14px 8px}
.sheet-head h2{flex:1;font-size:17px;font-weight:700;text-align:center}
.sheet-head .spacer{width:38px;flex-shrink:0}
.sheet-body{padding:6px 20px 20px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:12px 20px 16px;display:flex;gap:10px}
@keyframes rise{from{transform:translateY(40px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2.5px solid var(--fill-active);border-top-color:var(--text-secondary);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}

/* scanner */
.viewfinder{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#000;aspect-ratio:4/3}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder .reticle{position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:3px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.4)}
.viewfinder .laser{position:absolute;left:15%;right:15%;top:50%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* toast: a glass capsule above the tab bar */
.toast{position:fixed;left:50%;bottom:calc(max(env(safe-area-inset-bottom,0px),12px) + 82px);transform:translateX(-50%);z-index:200;padding:12px 18px;border-radius:var(--r-pill);font-weight:600;font-size:15px;animation:fade 240ms var(--ease);display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);white-space:nowrap}
.toast button{border:none;background:none;color:var(--tint);font-weight:700;cursor:pointer;font-size:15px}
@media (min-width:769px){.toast{bottom:28px}}

/* charts */
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{fill:var(--text-secondary);font-size:11px;font-family:var(--font)}
.tip{position:absolute;pointer-events:none;border-radius:var(--r-md);padding:8px 12px;font-size:13px;white-space:nowrap;z-index:5;
  background:var(--glass-bg-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow-glass),inset 0 0 0 .5px var(--glass-edge)}

/* auth */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 24px}
.auth .card{width:100%;max-width:400px;padding:28px 22px}
.err{color:var(--danger);font-size:15px;font-weight:500}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:20px;letter-spacing:.06em;text-align:center;padding:16px;border-radius:var(--r-md);background:var(--fill);user-select:all;-webkit-user-select:all}
details>summary{list-style:none;color:var(--tint);font-weight:500;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
a{color:var(--tint)}
</style>

/* ── API ──
   Same-origin, cookie session. Every request carries X-Tally, which the
   server requires on writes as its CSRF check. */
async function api(path, { method = 'GET', body, headers = {} } = {}) {
  let r;
  try {
    r = await fetch(path, {
      method, credentials: 'same-origin', cache: 'no-store',
      headers: { 'X-Tally': '1', ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}), ...headers },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch { const e = new Error('You’re offline'); e.offline = true; throw e; }
  if (r.status === 304) return { notModified: true, etag: r.headers.get('ETag') };
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(data.error || `Request failed (${r.status})`); e.status = r.status; e.data = data; throw e; }
  data.__etag = r.headers.get('ETag');
  return data;
}

/* ── updates ─────────────────────────────────────────────────────────
   Picking up a new deploy without anyone clearing the cache (the same scheme
   as For The Ummah, src/lib/updates.ts).

   Why it's needed: a Home Screen app on iOS is resumed, not reloaded, so the
   browser's own service-worker check (which runs on navigation) almost never
   happens, and when a new worker did take over, the open page kept running
   the old code.

   1. Every build has one id (scripts/build.mjs): in the page
      (window.__TALLY_BUILD__), in sw.js and in /version.json.
   2. When the app comes back to the foreground, comes online, or every 30
      minutes, it re-checks sw.js and fetches version.json uncached.
   3. The new worker takes over at once, so controllerchange fires. The app
      then reloads, but never mid-task: while a sheet is open or you're
      typing, an "Update ready" pill waits until you're done. Nothing is
      lost either way, because every change is saved to this device as it's
      made and synced after the reload.
   4. At most one automatic reload per build, so a genuinely broken deploy
      can't put the app in a reload loop. "Repair app" (Me) is the way out. */
const APP_BUILD = window.__TALLY_BUILD__ || 'dev';
const buildDate = (b) => { const t = parseInt(b, 36); return b !== 'dev' && t > 1.6e12 ? new Date(t) : null; };
const Updates = {
  RELOAD_GUARD: 'tally_update_reload',
  CHECK_EVERY_MS: 30 * 60_000,
  ready: false,
  isBusy: () => false,               /* App replaces this */
  beforeReload: async () => {},      /* App replaces this: flush unsynced changes */
  subs: new Set(),
  set(v) { this.ready = v; this.subs.forEach((f) => f(v)); },
  async reloadNow() {
    try {
      if (sessionStorage.getItem(this.RELOAD_GUARD) === APP_BUILD) return;
      sessionStorage.setItem(this.RELOAD_GUARD, APP_BUILD);
    } catch {}
    try { await Promise.race([this.beforeReload(), new Promise((r) => setTimeout(r, 2500))]); } catch {}
    location.reload();
  },
  /* Reload into the new version now, or as soon as the person is done. */
  apply() {
    this.set(true);
    if (!this.isBusy()) this.reloadNow();
  },
  /* Re-check sw.js and compare the deployed build with ours. */
  async check() {
    if (!('serviceWorker' in navigator) || APP_BUILD === 'dev') return false;
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      await reg?.update().catch(() => {});
      const r = await fetch('/version.json', { cache: 'no-store' });
      const { build } = r.ok ? await r.json() : {};
      const newer = !!build && build !== APP_BUILD;
      /* Normally the new worker's controllerchange triggers this. If the
         worker didn't change or is slow to swap, go anyway: the shell is
         network-first, so a reload fetches the new page. */
      if (newer) setTimeout(() => { if (!this.ready) this.apply(); }, 4000);
      return newer;
    } catch { return false; }
  },
  /* Drop the service worker and cached app shell (your data stays: it lives
     on the server and in this device's local storage), then reload. */
  async repair() {
    try {
      const regs = await navigator.serviceWorker?.getRegistrations();
      await Promise.all((regs || []).map((r) => r.unregister()));
      const keys = await caches.keys();
      await Promise.all(keys.filter((k) => k.startsWith('tally-')).map((k) => caches.delete(k)));
    } catch {}
    try { sessionStorage.removeItem(this.RELOAD_GUARD); } catch {}
    location.reload();
  },
  register() {
    if (!('serviceWorker' in navigator)) return;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      /* The very first install claiming the page isn't an update. */
      if (hadController) this.apply();
    });
    /* updateViaCache 'none': the browser never answers sw.js from HTTP cache. */
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
    let last = Date.now();
    const maybe = () => {
      if (document.visibilityState !== 'visible' || Date.now() - last < 60_000) return;
      last = Date.now();
      this.check();
    };
    document.addEventListener('visibilitychange', maybe);
    window.addEventListener('focus', maybe);
    window.addEventListener('online', maybe);
    setInterval(() => { last = 0; maybe(); }, this.CHECK_EVERY_MS);
  },
};
/* Exposed for the end-to-end update test and for debugging from Safari. */
window.TallyUpdates = Updates;
Updates.register();

/* ── passkeys (WebAuthn) ── */
const b64u = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec: (s) => { const t = s.replace(/-/g,'+').replace(/_/g,'/'); return Uint8Array.from(atob(t + '='.repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0)); },
};
const passkeysSupported = () => !!(window.PublicKeyCredential && navigator.credentials?.create);
const passkeyName = () => {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone (Face ID)';
  if (/iPad/.test(ua)) return 'iPad';
  if (/Android/.test(ua)) return 'Android phone';
  if (/Mac OS X/.test(ua)) return 'Mac (Touch ID)';
  if (/Windows/.test(ua)) return 'Windows Hello';
  return 'Passkey';
};
async function registerPasskey() {
  const { challengeId, publicKey: o } = await api('/api/passkey/register-options', { method:'POST', body:{} });
  const cred = await navigator.credentials.create({ publicKey: {
    ...o, challenge: b64u.dec(o.challenge), user: { ...o.user, id: b64u.dec(o.user.id) },
    excludeCredentials: (o.excludeCredentials || []).map(c => ({ ...c, id: b64u.dec(c.id) })),
  }});
  const res = cred.response;
  if (!res.getPublicKey || !res.getAuthenticatorData) throw new Error('This browser can’t set up passkeys for Tally — try Safari, Chrome or Edge.');
  const spki = res.getPublicKey();
  if (!spki) throw new Error('This passkey type isn’t supported.');
  await api('/api/passkey/register', { method:'POST', body: {
    challengeId, id: cred.id, name: passkeyName(),
    clientDataJSON: b64u.enc(res.clientDataJSON), authenticatorData: b64u.enc(res.getAuthenticatorData()),
    publicKey: b64u.enc(spki), alg: res.getPublicKeyAlgorithm(),
  }});
}
async function signInWithPasskey() {
  const { challengeId, publicKey: o } = await api('/api/passkey/login-options', { method:'POST', body:{} });
  const cred = await navigator.credentials.get({ publicKey: { ...o, challenge: b64u.dec(o.challenge) } });
  const res = cred.response;
  return api('/api/passkey/login', { method:'POST', body: {
    challengeId, id: cred.id,
    clientDataJSON: b64u.enc(res.clientDataJSON), authenticatorData: b64u.enc(res.authenticatorData), signature: b64u.enc(res.signature),
  }});
}

function Sheet({ title, onClose, children, footer, wide }) {
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [onClose]);
  return ReactDOM.createPortal(
    <div className="scrim" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="sheet" role="dialog" aria-modal="true" aria-label={title} style={wide ? { maxWidth: 680 } : null}>
        <div className="grabber" aria-hidden="true"/>
        <div className="sheet-head"><span className="spacer"/><h2>{title}</h2><button className="icon-btn" aria-label="Close" onClick={onClose}>{Ic.x}</button></div>
        <div className="sheet-body">{children}</div>
        {footer && <div className="sheet-foot">{footer}</div>}
      </div>
    </div>, document.body);
}

function Seg({ value, options, onChange }) {
  return <div className="seg" role="tablist">{options.map(([v, l]) =>
    <button key={v} role="tab" aria-selected={value === v} className={value === v ? 'on' : ''} onClick={() => onChange(v)}>{l}</button>)}</div>;
}

/* A <label> wraps a single input. Fields holding several controls (a unit
   toggle plus boxes) use `group`: inside a <label>, tapping the caption
   would "click" the first button — flipping the unit by accident. */
function Field({ label, children, hint, group }) {
  const Tag = group ? 'div' : 'label';
  return <Tag className="field" {...(group ? { role: 'group', 'aria-label': label } : {})}><span>{label}</span>{children}{hint && <small className="muted" style={{fontSize:12}}>{hint}</small>}</Tag>;
}

/* Weight input in the user's units. Stone users type stones + pounds. */
function WeightInput({ kg, units, onChange, autoFocus, id }) {
  const toParts = (k) => {
    if (k == null || k === '') return { a: '', b: '' };
    if (units === 'st') { const lb = k * E.LB_PER_KG; const st = Math.floor(lb / 14); return { a: String(st), b: String(r1(lb - st * 14)) }; }
    return { a: String(r1(E.kgTo(k, units))), b: '' };
  };
  const [p, setP] = useState(() => toParts(kg));
  useEffect(() => { setP(toParts(kg)); }, [units]);
  const emit = (a, b) => {
    setP({ a, b });
    const A = parseFloat(a), B = parseFloat(b) || 0;
    if (units === 'st') onChange(isFinite(A) || B ? E.toKg((isFinite(A) ? A : 0) + B / 14, 'st') : null);
    else onChange(isFinite(A) ? E.toKg(A, units) : null);
  };
  if (units === 'st') return (
    <div className="row gap8">
      <div className="row gap6 grow"><input id={id} className="input num" inputMode="numeric" placeholder="st" aria-label="Stones" value={p.a} autoFocus={autoFocus} onChange={e => emit(e.target.value, p.b)}/><span className="muted">st</span></div>
      <div className="row gap6 grow"><input className="input num" inputMode="decimal" placeholder="lb" aria-label="Pounds" value={p.b} onChange={e => emit(p.a, e.target.value)}/><span className="muted">lb</span></div>
    </div>);
  return <div className="row gap8"><input id={id} className="input num" inputMode="decimal" placeholder="0.0" aria-label={`Weight in ${units}`} value={p.a} autoFocus={autoFocus} onChange={e => emit(e.target.value)}/><span className="muted">{units}</span></div>;
}

/* Height in cm or feet & inches, independent of the weight unit — plenty of
   people weigh in kg but think of their height in feet. Stored as cm.
   Inches are rounded on the total first, so 182.6 cm is 6 ft 0 in, never
   "5 ft 12 in". */
const heightUnitFor = (p) => p?.heightUnit || ((p?.units || 'kg') === 'kg' ? 'cm' : 'ft');
const cmToFtIn = (cm) => { const total = Math.round(cm / 2.54); return { ft: Math.floor(total / 12), inch: total % 12 }; };

function HeightInput({ cm, unit, onChange, onUnitChange }) {
  const toParts = () => (cm ? cmToFtIn(cm) : null);
  const [ft, setFt] = useState(() => toParts() ? String(toParts().ft) : '');
  const [inch, setIn] = useState(() => toParts() ? String(toParts().inch) : '');
  /* Re-derive the boxes when switching unit, so 175 cm shows as 5 ft 9 in. */
  useEffect(() => { const p = toParts(); setFt(p ? String(p.ft) : ''); setIn(p ? String(p.inch) : ''); }, [unit]);
  const emit = (f, i) => {
    setFt(f); setIn(i);
    const F = parseFloat(f) || 0, I = parseFloat(i) || 0;
    onChange(F || I ? Math.round((F * 12 + I) * 2.54 * 10) / 10 : null);
  };
  return (
    <div className="stack gap8">
      {onUnitChange && <Seg value={unit} onChange={onUnitChange} options={[['cm','cm'],['ft','ft & in']]}/>}
      {unit === 'cm'
        ? <div className="row gap8"><input className="input num" inputMode="numeric" placeholder="170" aria-label="Height in centimetres" value={cm ? String(Math.round(cm)) : ''} onChange={e => onChange(parseInt(e.target.value.replace(/D/g, ''), 10) || null)}/><span className="muted">cm</span></div>
        : <div className="row gap8">
            <div className="row gap6 grow"><input className="input num" inputMode="numeric" placeholder="5" aria-label="Feet" value={ft} onChange={e => emit(e.target.value.replace(/D/g, ''), inch)}/><span className="muted">ft</span></div>
            <div className="row gap6 grow"><input className="input num" inputMode="decimal" placeholder="9" aria-label="Inches" value={inch} onChange={e => emit(ft, e.target.value)}/><span className="muted">in</span></div>
          </div>}
    </div>);
}

function MacroBar({ label, value, target, color }) {
  const pct = target ? Math.min(100, (value / target) * 100) : 0;
  return (
    <div className="stack gap6 grow">
      <span style={{fontWeight:600,fontSize:13}}><span style={{display:'inline-block',width:8,height:8,borderRadius:4,background:color,marginRight:6}}/>{label}</span>

/* Remaining-calories ring. One headline number; eaten and target sit beside
   it as plain text so the ring is never the only carrier of the value. */
function Ring({ eaten, target, bonus }) {
  const R = 64, C = 2 * Math.PI * R;
  const over = eaten > target;
  const frac = target ? Math.min(1, eaten / target) : 0;
  const left = target - eaten;
  return (
    <div className="row gap20" style={{alignItems:'center'}}>
      <div style={{position:'relative',width:156,height:156,flexShrink:0}}>
        <svg viewBox="0 0 156 156" width="156" height="156" aria-hidden="true">
          <circle cx="78" cy="78" r={R} fill="none" stroke="var(--fill-active)" strokeWidth="12"/>
          <circle cx="78" cy="78" r={R} fill="none" stroke={over ? 'var(--warning)' : 'var(--accent)'} strokeWidth="12" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C * (1 - frac)} transform="rotate(-90 78 78)" style={{transition:'stroke-dashoffset 500ms var(--ease)'}}/>
        </svg>
        <div className="stack" style={{position:'absolute',inset:0,alignItems:'center',justifyContent:'center'}}>
          <div className="num" style={{fontSize:30,fontWeight:700,letterSpacing:'-.03em',color: over ? 'var(--warning)' : 'var(--text-primary)'}}>{fmtK(Math.abs(left))}</div>
          <div className="muted" style={{fontSize:12,fontWeight:700}}>{over ? 'kcal over' : 'kcal left'}</div>
        </div>
      </div>

        <div><div className="label">Eaten</div><div className="num" style={{fontSize:20,fontWeight:700}}>{fmtK(eaten)}</div></div>
        <div><div className="label">Target</div><div className="num" style={{fontSize:20,fontWeight:700}}>{fmtK(target)}</div>
          {bonus > 0 && <div className="num" style={{fontSize:13,color:'var(--accent)',fontWeight:600}}>incl. +{fmtK(bonus)} exercise</div>}</div>
      </div>

}

function useWidth(ref) {
  const [w, setW] = useState(600);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(([e]) => setW(Math.max(280, e.contentRect.width)));
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return w;
}

function WeightChart({ weights, units, goalKg, rangeDays, rate }) {
  const ref = useRef(null);

  const series = useMemo(() => {
    const all = E.trendSeries(weights);
    if (!rangeDays) return all;
    const from = E.addDays(E.today(), -rangeDays);
    return all.filter(d => d.date >= from);
  }, [weights, rangeDays]);
  if (series.length < 2) return <div ref={ref} className="sub" style={{padding:'30px 0',textAlign:'center'}}>Log a couple of weigh-ins to see your timeline.</div>;

  const first = series[0].date, last = series[series.length - 1].date;
  /* Project the trend forward a little when losing, so "where am I heading"
     is visible without a separate chart. */
  const proj = [];
  if (rate && rate.kgPerDay < 0 && goalKg) {
    const t0 = series[series.length - 1].trend;
    const days = Math.min(Math.max(14, Math.round(E.daysBetween(first, last) * 0.25)), Math.ceil((t0 - goalKg) / -rate.kgPerDay));
    for (let i = 0; i <= days; i += Math.max(1, Math.floor(days / 20))) proj.push({ date: E.addDays(last, i), v: Math.max(goalKg, t0 + rate.kgPerDay * i) });
  }
  const endDate = proj.length ? proj[proj.length - 1].date : last;
  const span = Math.max(1, E.daysBetween(first, endDate));
  const vals = series.flatMap(d => [d.kg, d.trend]).filter(v => v != null).concat(proj.map(p => p.v));
  const showGoal = goalKg && goalKg >= Math.min(...vals) - 3;
  if (showGoal) vals.push(goalKg);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padKg = Math.max(0.5, (hi - lo) * 0.1); lo -= padKg; hi += padKg;
  const x = (d) => P.l + (E.daysBetween(first, d) / span) * (W - P.l - P.r);
  const y = (kg) => P.t + (1 - (kg - lo) / (hi - lo)) * (H - P.t - P.b);
  const disp = (kg) => units === 'st' ? E.kgTo(kg, 'lb') : E.kgTo(kg, units);
  const ticks = 4;
  const yTicks = Array.from({ length: ticks }, (_, i) => lo + ((hi - lo) * (i + 0.5)) / ticks);
  const xTicks = [first, E.addDays(first, Math.round(span / 2)), endDate];
  const trendPath = series.map((d, i) => `${i ? 'L' : 'M'}${x(d.date).toFixed(1)},${y(d.trend).toFixed(1)}`).join('');
  const projPath = proj.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join('');

  const onMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const day = Math.round(((px - P.l) / (W - P.l - P.r)) * span);
    const d = series[Math.max(0, Math.min(series.length - 1, day))];
    setHover(d);
  };
  return (
    <div ref={ref} style={{position:'relative'}}>
      <svg className="chart" viewBox={`0 0 ${W} ${H}`} onPointerMove={onMove} onPointerLeave={() => setHover(null)} role="img"
        aria-label={`Weight from ${shortDate(first)} to ${shortDate(last)}: trend ${E.fmtWeight(series[series.length-1].trend, units)}`}>
        {yTicks.map((v, i) => <g key={i}>
          <line x1={P.l} x2={W - P.r} y1={y(v)} y2={y(v)} stroke="var(--border)" strokeWidth="1"/>
          <text x={P.l - 8} y={y(v) + 4} textAnchor="end">{disp(v).toFixed(units === 'kg' ? 1 : 0)}</text>
        </g>)}
        <text x={P.l - 8} y={P.t - 2} textAnchor="end" style={{fontWeight:600}}>{units === 'st' ? 'lb' : units}</text>
        {xTicks.map((d, i) => <text key={i} x={x(d)} y={H - 6} textAnchor={i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}>{shortDate(d)}</text>)}
        {showGoal && <g>
          <line x1={P.l} x2={W - P.r} y1={y(goalKg)} y2={y(goalKg)} stroke="var(--good)" strokeWidth="1.5" strokeDasharray="5 5" opacity=".7"/>
          <text x={W - P.r} y={y(goalKg) - 6} textAnchor="end" style={{fill:'var(--good)',fontWeight:700}}>Goal</text>
        </g>}
        {series.filter(d => d.kg != null).map(d => <circle key={d.date} cx={x(d.date)} cy={y(d.kg)} r="3.5" fill="var(--text-muted)" opacity=".55"/>)}
        <path d={trendPath} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
        {projPath && <path d={projPath} fill="none" stroke="var(--accent)" strokeWidth="2" strokeDasharray="2 5" strokeLinecap="round" opacity=".8"/>}
        {hover && <g>
          <line x1={x(hover.date)} x2={x(hover.date)} y1={P.t} y2={H - P.b} stroke="var(--border-strong)"/>
          <circle cx={x(hover.date)} cy={y(hover.trend)} r="5" fill="var(--accent)" stroke="var(--bg-surface)" strokeWidth="2"/>
        </g>}
      </svg>
      {hover && <div className="tip" style={{left: Math.min(Math.max(0, (x(hover.date) / W) * 100), 70) + '%', top: 0}}>
        <div style={{fontWeight:700}}>{prettyDate(hover.date)}</div>
        <div className="muted">Trend <b className="num" style={{color:'var(--text-primary)'}}>{E.fmtWeight(hover.trend, units)}</b></div>
        {hover.kg != null && <div className="muted">Scale <b className="num" style={{color:'var(--text-primary)'}}>{E.fmtWeight(hover.kg, units)}</b></div>}
      </div>}
      <div className="row gap16 wrap" style={{fontSize:12,marginTop:6,color:'var(--text-secondary)'}}>
        <span className="row gap6"><svg width="10" height="10"><circle cx="5" cy="5" r="3.5" fill="var(--text-muted)" opacity=".55"/></svg>Scale reading</span>
        <span className="row gap6"><svg width="18" height="6"><path d="M0 3h18" stroke="var(--accent)" strokeWidth="2.5"/></svg>Trend</span>
        {projPath && <span className="row gap6"><svg width="18" height="6"><path d="M0 3h18" stroke="var(--accent)" strokeWidth="2" strokeDasharray="2 4"/></svg>Projection</span>}
        {showGoal && <span className="row gap6"><svg width="18" height="6"><path d="M0 3h18" stroke="var(--good)" strokeWidth="1.5" strokeDasharray="4 3"/></svg>Goal</span>}
      </div>
    </div>);
}

function CalorieChart({ entries, target, days = 14 }) {
  const ref = useRef(null);
  const W = useWidth(ref), H = 170, P = { l: 40, r: 8, t: 12, b: 24 };
  const [hover, setHover] = useState(null);
  const by = useMemo(() => E.intakeByDay(entries), [entries]);
  const t = E.today();
  const data = Array.from({ length: days }, (_, i) => { const d = E.addDays(t, i - days + 1); return { date: d, kcal: by.get(d)?.kcal || 0 }; });
  const hi = Math.max(target * 1.25, ...data.map(d => d.kcal)) || 2500;
  const slot = (W - P.l - P.r) / days, bw = Math.max(6, Math.min(26, slot - 6));
  const y = (v) => P.t + (1 - v / hi) * (H - P.t - P.b);
  return (
    <div ref={ref} style={{position:'relative'}}>
      <svg className="chart" viewBox={`0 0 ${W} ${H}`} onPointerLeave={() => setHover(null)} role="img" aria-label={`Calories for the last ${days} days against a ${fmtK(target)} kcal target`}>
        {[0, 0.5, 1].map(f => <g key={f}><line x1={P.l} x2={W-P.r} y1={y(hi*f)} y2={y(hi*f)} stroke="var(--border)"/><text x={P.l-6} y={y(hi*f)+4} textAnchor="end">{f ? fmtK(hi*f) : 0}</text></g>)}
        {data.map((d, i) => {
          const cx = P.l + slot * i + slot / 2;
          const over = d.kcal > target;
          const h = Math.max(d.kcal ? 3 : 0, H - P.b - y(d.kcal));
          return <g key={d.date} onPointerEnter={() => setHover({ ...d, cx })}>
            <rect x={cx - slot / 2} y={P.t} width={slot} height={H - P.t - P.b} fill="transparent"/>
            {d.kcal > 0 && <path d={`M${cx-bw/2},${H-P.b} v${-(h-4)} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${h-4} z`} fill={over ? 'var(--warning)' : 'var(--accent)'} opacity={hover && hover.date !== d.date ? .45 : .9}/>}
            {(i === 0 || i === days - 1 || i === Math.floor(days / 2)) && <text x={cx} y={H - 6} textAnchor="middle">{i === days - 1 ? 'Today' : shortDate(d.date)}</text>}
          </g>;
        })}
        <line x1={P.l} x2={W - P.r} y1={y(target)} y2={y(target)} stroke="var(--text-secondary)" strokeWidth="1.5" strokeDasharray="5 4"/>
      </svg>
      {hover && <div className="tip" style={{left: Math.min(Math.max(0, (hover.cx / W) * 100 - 10), 70) + '%', top: 0}}>
        <div style={{fontWeight:700}}>{prettyDate(hover.date)}</div>
        <div className="muted"><b className="num" style={{color:'var(--text-primary)'}}>{fmtK(hover.kcal)}</b> kcal {hover.kcal ? (hover.kcal > target ? `· ${fmtK(hover.kcal - target)} over` : `· ${fmtK(target - hover.kcal)} under`) : '· nothing logged'}</div>
      </div>}
      <div className="row gap16 wrap" style={{fontSize:12,marginTop:6,color:'var(--text-secondary)'}}>
        <span className="row gap6"><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(--accent)"/></svg>At or under target</span>
        <span className="row gap6"><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(--warning)"/></svg>Over target</span>
        <span className="row gap6"><svg width="18" height="6"><path d="M0 3h18" stroke="var(--text-secondary)" strokeWidth="1.5" strokeDasharray="4 3"/></svg>Target</span>
      </div>
    </div>);
}

/* ── auth screen ── */
function AuthScreen({ onSignedIn }) {
  const [mode, setMode] = useState('signin'); /* signin | signup | recover */
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [invite, setInvite] = useState('');
  const [needInvite, setNeedInvite] = useState(false);
  const [code, setCode] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  /* Ask up front when the server is invite-only, rather than letting
     someone fill the form in only to be told afterwards. */
  useEffect(() => { api('/api/health').then(h => h.invite && setNeedInvite(true)).catch(() => {}); }, []);

  const run = async (fn) => {
    setErr(''); setBusy(true);
    try { await fn(); } catch (e) {
      if (e.data?.field === 'invite') setNeedInvite(true);
      if (e.name === 'NotAllowedError' || e.name === 'AbortError') setErr('Passkey sign-in was cancelled.');
      else setErr(e.message || 'Something went wrong');
    } finally { setBusy(false); }
  };
  const submit = (e) => {
    e.preventDefault();
    if (mode === 'signin') run(async () => { const r = await api('/api/auth/login', { method:'POST', body:{ email, password } }); onSignedIn(r.user); });
    if (mode === 'signup') run(async () => { const r = await api('/api/auth/signup', { method:'POST', body:{ email, password, invite } }); onSignedIn(r.user, { recoveryCode: r.recoveryCode, isNew: true }); });
    if (mode === 'recover') run(async () => { const r = await api('/api/auth/recover', { method:'POST', body:{ email, code, password } }); onSignedIn(r.user, { recoveryCode: r.recoveryCode }); });
  };
  const passkey = () => run(async () => { const r = await signInWithPasskey(); onSignedIn(r.user); });

  return (
    <div className="auth">
      <div className="card stack gap16">
        <div className="row gap10"><img src="/tally-icon.svg" alt="" width="34" height="34" style={{borderRadius:9}}/><div><h1 style={{fontSize:22}}>Tally</h1><div className="sub">Calorie deficit, made simple</div></div></div>
        {mode !== 'recover' && <Seg value={mode} onChange={(m) => { setMode(m); setErr(''); }} options={[['signin','Sign in'],['signup','Create account']]}/>}
        {mode === 'signin' && passkeysSupported() && <>
          <button className="btn block" onClick={passkey} disabled={busy}>{Ic.face} Sign in with passkey</button>
          <div className="row gap10 muted" style={{fontSize:12}}><div className="divider grow"/>or use email<div className="divider grow"/></div>
        </>}
        <form className="stack gap12" onSubmit={submit}>
          <Field label="Email"><input className="input" type="email" autoComplete={mode === 'signup' ? 'email' : 'username'} required value={email} onChange={e => setEmail(e.target.value)}/></Field>
          {mode === 'recover' && <Field label="Recovery code" hint="The code you saved when you created your account."><input className="input num" autoComplete="off" required value={code} onChange={e => setCode(e.target.value)} placeholder="XXXX-XXXX-XXXX-XXXX"/></Field>}
          <Field label={mode === 'recover' ? 'New password' : 'Password'} hint={mode !== 'signin' ? 'At least 8 characters.' : null}>
            <input className="input" type="password" autoComplete={mode === 'signin' ? 'current-password' : 'new-password'} required minLength={mode === 'signin' ? 1 : 8} value={password} onChange={e => setPassword(e.target.value)}/>
          </Field>
          {mode === 'signup' && needInvite && <Field label="Invite code" hint="Tally is invite-only. Ask whoever sent you the link for the code.">
            <input className="input" autoComplete="off" autoCapitalize="none" spellCheck="false" value={invite} onChange={e => setInvite(e.target.value)} required/></Field>}
          {err && <div className="err" role="alert">{err}</div>}
          <button className="btn primary block" disabled={busy}>{busy ? <span className="spinner"/> : mode === 'signin' ? 'Sign in' : mode === 'signup' ? 'Create account' : 'Reset password'}</button>
        </form>
        {mode === 'signin' && <button className="btn ghost sm" onClick={() => { setMode('recover'); setErr(''); }}>Forgot password?</button>}
        {mode === 'recover' && <button className="btn ghost sm" onClick={() => { setMode('signin'); setErr(''); }}>Back to sign in</button>}
      </div>
    </div>);
}

/* Shown once after signup / recovery. Without email infrastructure this code
   is the only way back in after a forgotten password, so it's worth a pause. */
function RecoverySheet({ code, isNew, onDone }) {
  const [copied, setCopied] = useState(false);
  const [adding, setAdding] = useState(false);
  const [msg, setMsg] = useState('');
  const addPasskey = async () => {
    setAdding(true); setMsg('');
    try { await registerPasskey(); setMsg('Passkey added — next time just tap “Sign in with passkey”.'); }
    catch (e) { setMsg(e.name === 'NotAllowedError' ? 'Cancelled.' : e.message); }
    finally { setAdding(false); }
  };
  return (
    <Sheet title={isNew ? 'Welcome to Tally' : 'Your new recovery code'} onClose={onDone}
      footer={<button className="btn primary block" onClick={onDone}>I’ve saved it</button>}>
      <div className="stack gap16">
        <p className="sub">Keep this recovery code somewhere safe, like a password manager or a note. It’s the only way to reset your password, and it won’t be shown again.</p>
        <div className="code">{code}</div>
        <button className="btn sm" onClick={() => { navigator.clipboard?.writeText(code); setCopied(true); }}>{copied ? 'Copied' : 'Copy code'}</button>
        {passkeysSupported() && <div className="card pad stack gap10" style={{background:'var(--bg-surface-2)'}}>
          <div className="row gap10">{Ic.face}<h2>Sign in with Face ID next time</h2></div>
          <p className="sub">Add a passkey and you can sign in with Face ID, Touch ID or Windows Hello. No password needed.</p>
          <button className="btn" onClick={addPasskey} disabled={adding}>{adding ? <span className="spinner"/> : 'Add passkey'}</button>
          {msg && <div className="sub">{msg}</div>}
        </div>}
      </div>
    </Sheet>);
}

/* ── onboarding ── */
function Onboarding({ state, onDone }) {
  const [step, setStep] = useState(0);
  const [p, setP] = useState(() => ({ units: 'kg', sex: 'female', activity: 'light', paceKg: 0.5, birthYear: '', heightCm: null, startKg: null, goalKg: null, ...(state.profile || {}) }));
  const set = (k, v) => setP(o => ({ ...o, [k]: v }));
  const draft = { ...state, profile: { ...p, birthYear: Number(p.birthYear) || null }, weights: p.startKg ? [{ id: 'w:' + E.today(), date: E.today(), kg: p.startKg }] : [] };
  const t = E.targets(draft);
  const range = E.healthyRangeKg(p.heightCm);
  const steps = [
    { title: 'About you', ok: p.heightCm > 100 && Number(p.birthYear) > 1900 && Number(p.birthYear) < new Date().getFullYear() - 12, body: <>
      <Field label="Units" group><Seg value={p.units} onChange={v => set('units', v)} options={[['kg','kg'],['st','st & lb'],['lb','lb']]}/></Field>
      <Field label="Sex" hint="Used in the calorie formula. Pick whichever is closest to your physiology." group><Seg value={p.sex} onChange={v => set('sex', v)} options={[['female','Female'],['male','Male'],['other','Other']]}/></Field>
      <Field label="Year of birth"><input className="input num" inputMode="numeric" placeholder="1990" value={p.birthYear || ''} onChange={e => set('birthYear', e.target.value.replace(/\D/g,'').slice(0,4))}/></Field>
      <Field label="Height" group><HeightInput cm={p.heightCm} unit={heightUnitFor(p)} onChange={v => set('heightCm', v)} onUnitChange={u => set('heightUnit', u)}/></Field>
    </> },
    { title: 'Your weight', ok: p.startKg > 30 && p.goalKg > 30, body: <>
      <Field label="Current weight" group><WeightInput kg={p.startKg} units={p.units} onChange={v => set('startKg', v)}/></Field>
      <Field label="Goal weight" hint={range ? `A healthy range for your height is about ${E.fmtWeight(range.min, p.units)} – ${E.fmtWeight(range.max, p.units)}.` : null} group>
        <WeightInput kg={p.goalKg} units={p.units} onChange={v => set('goalKg', v)}/>
      </Field>
      {range && p.goalKg && p.goalKg < range.min && <div className="err">That goal is below a healthy weight for your height. Tally will warn you about this.</div>}
    </> },
    { title: 'How active are you?', ok: true, body: <div className="stack gap8">
      <p className="sub">Your normal day, not counting workouts. You’ll log those as exercise, or sync them from Apple Health.</p>
      {Object.entries(E.ACTIVITY).map(([k, a]) =>
        <button key={k} className={'card pad row between' } style={{textAlign:'left',cursor:'pointer',borderColor: p.activity === k ? 'var(--accent)' : undefined, background: p.activity === k ? 'var(--accent-soft)' : undefined}} onClick={() => set('activity', k)}>
          <div><div style={{fontWeight:700}}>{a.label}</div><div className="sub">{a.hint}</div></div>{p.activity === k && Ic.check}
        </button>)}
    </div> },
    { title: 'Choose your pace', ok: true, body: <>
      <div className="stack gap8">
        {E.PACES.map(pc => {
          const pct = p.startKg ? (pc.kg / p.startKg) * 100 : 0;
          return <button key={pc.id} className="card pad row between" style={{textAlign:'left',cursor:'pointer',borderColor: p.paceKg === pc.kg ? 'var(--accent)' : undefined, background: p.paceKg === pc.kg ? 'var(--accent-soft)' : undefined}} onClick={() => set('paceKg', pc.kg)}>
            <div><div style={{fontWeight:700}}>{pc.label} · {E.fmtWeight(pc.kg, p.units)}/week</div>
              <div className="sub">{pct > 1 ? 'Faster than the ~1% a week usually recommended' : pc.id === 'steady' ? 'Recommended for most people' : pc.id === 'gentle' ? 'Easiest to stick with' : 'Quicker, needs discipline'}</div></div>
            {p.paceKg === pc.kg && Ic.check}
          </button>;
        })}
      </div>
      <div className="card pad stack gap6" style={{background:'var(--bg-surface-2)'}}>
        <div className="label">Your daily target</div>
        <div className="num" style={{fontSize:30,fontWeight:700}}>{fmtK(t.kcal)} <span className="sub">kcal</span></div>
        <div className="sub">Maintenance ≈ {fmtK(t.tdee)} kcal · deficit {fmtK(t.deficit)} kcal/day</div>
        {t.floorApplied && <div className="sub" style={{color:'var(--warning)'}}>Held at {t.floor} kcal, the safe minimum. You’ll lose about {E.fmtWeight(Math.max(0,t.plannedPaceKg), p.units)} a week.</div>}
        {(() => { const pr = E.projection(p.startKg, p.goalKg, t.plannedPaceKg); return pr ? <div className="sub">Goal reached around <b>{E.parseIso(pr.date).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b>.</div> : null; })()}
      </div>
    </> },
  ];
  const s = steps[step];
  const finish = () => onDone({ ...p, birthYear: Number(p.birthYear), done: true, startDate: E.today(), updated: Date.now() });
  return (
    <div className="page" style={{maxWidth:520}}>
      <div className="stack gap20">
        <div className="row gap6">{steps.map((_, i) => <div key={i} className="grow bar" style={{height:5}}><i style={{width: i <= step ? '100%' : '0%', background:'var(--accent)'}}/></div>)}</div>
        <div><div className="label">Step {step + 1} of {steps.length}</div><h1>{s.title}</h1></div>
        <div className="stack gap16">{s.body}</div>
        <div className="row gap10">
          {step > 0 && <button className="btn" onClick={() => setStep(step - 1)}>Back</button>}
          <button className="btn primary grow" disabled={!s.ok} onClick={() => step < steps.length - 1 ? setStep(step + 1) : finish()}>{step < steps.length - 1 ? 'Continue' : 'Start tracking'}</button>
        </div>
      </div>
    </div>);
}

/* ── barcode scanner ──
   Native BarcodeDetector where the browser has it (Chrome/Android), ZXing
   (vendored, loaded on demand) everywhere else — notably iOS Safari. */
function BarcodeScanner({ onCode }) {
  const video = useRef(null);
  const [err, setErr] = useState('');
  const [manual, setManual] = useState('');
  const done = useRef(false);
  useEffect(() => {
    let stream, raf, reader, cancelled = false;
    const hit = (code) => { if (done.current || !code) return; done.current = true; navigator.vibrate?.(40); onCode(String(code)); };
    (async () => {
      try {
        const formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
        const native = 'BarcodeDetector' in window && (await window.BarcodeDetector.getSupportedFormats?.() || []).includes('ean_13');
        if (native) {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
          if (cancelled) return;
          video.current.srcObject = stream; await video.current.play();
          const det = new window.BarcodeDetector({ formats });
          const tick = async () => {
            if (cancelled || done.current) return;
            try { const r = await det.detect(video.current); if (r[0]) return hit(r[0].rawValue); } catch {}
            raf = setTimeout(tick, 180);
          };
          tick();
        } else {
          await loadScript('/vendor/zxing.min.js');
          if (cancelled) return;
          const Z = window.ZXing;
          const hints = new Map([[Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]], [Z.DecodeHintType.TRY_HARDER, true]]);
          reader = new Z.BrowserMultiFormatReader(hints, 250);
          await reader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } }, audio: false }, video.current, (res) => res && hit(res.getText()));
        }
      } catch (e) {
        setErr(e.name === 'NotAllowedError' ? 'Camera access was blocked. Allow it in your browser settings, or type the barcode below.' : 'Couldn’t start the camera. Type the barcode below instead.');
      }
    })();
    return () => { cancelled = true; clearTimeout(raf); try { reader?.reset(); } catch {} stream?.getTracks().forEach(t => t.stop()); };
  }, []);
  return (
    <div className="stack gap12">
      <div className="viewfinder"><video ref={video} playsInline muted/><div className="reticle"/><div className="laser"/></div>
      {err ? <div className="err">{err}</div> : <div className="sub" style={{textAlign:'center'}}>Line the barcode up inside the box</div>}
      <form className="row gap8" onSubmit={(e) => { e.preventDefault(); manual.replace(/\D/g,'').length >= 8 && onCode(manual.replace(/\D/g,'')); }}>
        <input className="input num" inputMode="numeric" placeholder="Or type the barcode number" value={manual} onChange={e => setManual(e.target.value)}/>
        <button className="btn">Look up</button>
      </form>
    </div>);
}

function PortionPicker({ food, initialGrams, meal, setMeal, onAdd, addLabel = 'Add' }) {
  const unit = food.unit || 'g';
  const hasServing = !!food.serving?.g;
  const [mode, setMode] = useState(hasServing && !initialGrams ? 'serving' : 'grams');
  const [servings, setServings] = useState('1');
  const [grams, setGrams] = useState(String(initialGrams || food.serving?.g || 100));
  const g = mode === 'serving' ? (parseFloat(servings) || 0) * food.serving.g : parseFloat(grams) || 0;
  const m = E.portion(food, g);
  return (
    <div className="stack gap16">
      <div className="row gap12">
        {food.image ? <img className="thumb" src={food.image} alt="" style={{width:52,height:52}}/> : <div className="thumb row" style={{width:52,height:52,justifyContent:'center',color:'var(--accent)'}}>{Ic.bolt}</div>}
        <div className="grow"><div style={{fontWeight:700,fontSize:16}}>{food.name}</div><div className="sub">{[food.brand, `${food.per100.kcal} kcal per 100${unit}`].filter(Boolean).join(' · ')}</div></div>
      </div>
      {food.estimate && <div className="sub" style={{fontSize:13}}>Typical UK portion. Restaurants vary, so adjust if yours was bigger or smaller.</div>}
      {hasServing && <Seg value={mode} onChange={setMode} options={[['serving', `Servings (${food.serving.label || food.serving.g + unit})`], ['grams', unit === 'ml' ? 'Millilitres' : 'Grams']]}/>}
      {mode === 'serving'
        ? <div className="row gap8">{['0.5','1','2'].map(v => <button key={v} className={'chip' + (servings === v ? ' on' : '')} onClick={() => setServings(v)}>{v === '0.5' ? '½' : v}</button>)}
            <input className="input num grow" inputMode="decimal" value={servings} onChange={e => setServings(e.target.value)} aria-label="Servings"/></div>
        : <div className="row gap8"><input className="input num grow" inputMode="decimal" value={grams} onChange={e => setGrams(e.target.value)} aria-label={unit}/><span className="muted">{unit}</span></div>}
      <div className="card pad row between" style={{background:'var(--bg-surface-2)'}}>
        <div><div className="num" style={{fontSize:26,fontWeight:700}}>{fmtK(m.kcal)}</div><div className="label">kcal</div></div>
        <div className="row gap16 num" style={{fontSize:13}}>
          <span><b style={{color:'var(--protein)'}}>P</b> {m.protein}g</span><span><b style={{color:'var(--carbs)'}}>C</b> {m.carbs}g</span><span><b style={{color:'var(--fat)'}}>F</b> {m.fat}g</span>
        </div>
      </div>
      {setMeal && <Field label="Meal" group><Seg value={meal} onChange={setMeal} options={E.MEALS.map(k => [k, MEAL_LABEL[k]])}/></Field>}
      <button className="btn primary block" disabled={!g} onClick={() => onAdd(g, m)}>{addLabel} · {fmtK(m.kcal)} kcal</button>
    </div>);
}
