        {pw ? <form className="stack gap10" onSubmit={async e => { e.preventDefault(); try { await api('/api/auth/password', { method:'POST', body:{ current: pw.current, next: pw.next } }); setPw({ done: true }); } catch (er) { setPw({ ...pw, err: er.message }); } }}>
            {pw.done ? <div className="sub">Password changed. Other devices have been signed out.</div> : <>
              <Field label="Current password"><input className="input" type="password" autoComplete="current-password" value={pw.current || ''} onChange={e => setPw({ ...pw, current: e.target.value })}/></Field>
              <Field label="New password"><input className="input" type="password" autoComplete="new-password" minLength={8} value={pw.next || ''} onChange={e => setPw({ ...pw, next: e.target.value })}/></Field>
              {pw.err && <div className="err">{pw.err}</div>}
              <div className="row gap8"><button type="button" className="btn grow" onClick={() => setPw(null)}>Cancel</button><button className="btn primary grow">Change password</button></div></>}
          </form>
          : <button className="btn" onClick={() => setPw({})}>Change password</button>}
        <button className="btn" onClick={signOut}>{Ic.logout} Sign out</button>
      </div>

      <AppVersionCard/>

      <div className="card pad stack gap12">
        <h2>Appearance</h2>
        <Seg value={theme} onChange={setTheme} options={[['system','Auto'],['dark','Dark'],['light','Light']]}/>
      </div>

      <div className="card pad stack gap12">
        <h2 style={{color:'var(--danger)'}}>Delete account</h2>
        {del ? <form className="stack gap10" onSubmit={async e => { e.preventDefault(); try { await api('/api/auth/delete', { method:'POST', body:{ password: del.password } }); signOut(true); } catch (er) { setDel({ ...del, err: er.message }); } }}>
            <p className="sub">This permanently deletes your account and everything you’ve logged. It can’t be undone. Download a backup first if you might want it.</p>
            <Field label="Password"><input className="input" type="password" autoComplete="current-password" value={del.password || ''} onChange={e => setDel({ ...del, password: e.target.value })}/></Field>
            {del.err && <div className="err">{del.err}</div>}
            <div className="row gap8"><button type="button" className="btn grow" onClick={() => setDel(null)}>Cancel</button><button className="btn danger grow">Delete forever</button></div>
          </form>
          : <button className="btn danger" onClick={() => setDel({})}>Delete my account…</button>}
      </div>
    </div>);
}

/* ── app ── */
const VIEWS = [['today','Today',Ic.today],['progress','Progress',Ic.progress],['insights','Insights',Ic.insight],['me','Me',Ic.me]];

function App() {
  const [account, setAccount] = useState(undefined); /* undefined = loading, null = signed out */
  const [state, setStateRaw] = useState(null);
  const [sync, setSync] = useState('idle');           /* idle|saving|synced|offline */
  const [view, setView] = useState(() => new URLSearchParams(location.search).get('view') || 'today');
  const [date, setDate] = useState(E.today());
  const [modal, setModal] = useState(null);           /* { kind, arg } */
  const [toast, setToast] = useState(null);
  const [recovery, setRecovery] = useState(null);
  const [theme, setThemeState] = useState(ThemePref.get());
  const user = account?.user;
  const stateRef = useRef(null); stateRef.current = state;
  const saveTimer = useRef(null), etag = useRef(null), dirty = useRef(false);

  const showToast = (msg, undo) => { setToast({ msg, undo, id: Date.now() }); };

  /* Updates: busy while a sheet is open or the person is typing anywhere.
     When a new version is waiting, it's applied the moment they're done. */
  const [updateReady, setUpdateReady] = useState(Updates.ready);
  const modalRef = useRef(null); modalRef.current = modal;
  useEffect(() => {
    window.__tallyMounted = true;
    const typing = () => { const a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable); };
    Updates.isBusy = () => !!modalRef.current || typing();
    Updates.subs.add(setUpdateReady);
    return () => Updates.subs.delete(setUpdateReady);
  }, []);
  useEffect(() => {
    if (!updateReady) return;
    const tryNow = () => { if (!Updates.isBusy()) Updates.reloadNow(); };
    tryNow();
    /* Also when focus leaves a field, and when the app is backgrounded. */
    document.addEventListener('focusout', tryNow);
    const onHide = () => document.visibilityState === 'hidden' && tryNow();
    document.addEventListener('visibilitychange', onHide);
    return () => { document.removeEventListener('focusout', tryNow); document.removeEventListener('visibilitychange', onHide); };
  }, [updateReady, modal]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), toast.undo ? 5000 : 2600); return () => clearTimeout(t); }, [toast]);

  /* ── session boot ── */
  const loadAccount = useCallback(async () => {
    try { const me = await api('/api/auth/me'); setAccount(me.user ? me : null); if (me.user) Cache.setUser(me.user); else Cache.setUser(null); return me; }
    catch (e) {
      /* Offline: trust the last signed-in user and run from the cache. */
      const u = Cache.user(); setAccount(u ? { user: u, offline: true } : null); return null;
    }
  }, []);
  useEffect(() => { loadAccount(); }, []);

  /* ── state load & sync ── */
  const push = useCallback(async (s, { merged = false } = {}) => {
    if (!user) return;
    setSync('saving');
    try {
      const r = await api('/api/state' + (merged ? '?return=merged' : ''), { method: 'PUT', body: s });
      etag.current = r.__etag; dirty.current = false; setSync('synced');
      return r;
    } catch (e) {
      if (e.status === 401) { setAccount(null); return; }
      setSync('offline');
    }
  }, [user?.id]);

  const pull = useCallback(async ({ conditional = false } = {}) => {
    if (!user) return;
    try {
      const r = await api('/api/state', { headers: conditional && etag.current ? { 'If-None-Match': etag.current } : {} });
      if (r.notModified) { setSync('synced'); return; }
      etag.current = r.__etag;
      const { __etag, ...remote } = r;
      const local = stateRef.current || Cache.read(user.id);
      const merged = hydrate(E.mergeState(local, remote));
      setStateRaw(merged); Cache.write(user.id, merged);
      if (dirty.current || JSON.stringify(merged) !== JSON.stringify(hydrate(remote))) push(merged);
      else setSync('synced');
    } catch (e) {
      if (e.status === 401) { setAccount(null); return; }
      setSync('offline');
    }
  }, [user?.id, push]);

  useEffect(() => {
    if (!user) { setStateRaw(null); return; }
    setStateRaw(hydrate(Cache.read(user.id)));
    pull();
  }, [user?.id]);

  /* Refresh when the app comes back to the foreground or the network returns. */
  useEffect(() => {
    if (!user) return;
    const onVis = () => document.visibilityState === 'visible' && pull({ conditional: true });
    const onOnline = () => pull();
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('online', onOnline);
    return () => { document.removeEventListener('visibilitychange', onVis); window.removeEventListener('online', onOnline); };
  }, [user?.id, pull]);

  /* Flush pending changes if the page is closed mid-debounce. */
  useEffect(() => {
    const flush = () => {
      if (!dirty.current || !stateRef.current || !user) return;
      fetch('/api/state', { method: 'PUT', keepalive: true, credentials: 'same-origin', headers: { 'X-Tally': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(stateRef.current) }).catch(() => {});
    };
    window.addEventListener('pagehide', flush);
    return () => window.removeEventListener('pagehide', flush);
  }, [user?.id]);

  const setState = useCallback((fn) => {
    setStateRaw(prev => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      if (user) Cache.write(user.id, next);
      dirty.current = true; setSync('saving');
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => push(stateRef.current), 1200);
      return next;
    });
  }, [user?.id, push]);

  /* Push anything not yet synced before an update reloads the page. (It's
     already saved on the device, so this is belt and braces.) */
  useEffect(() => {
    Updates.beforeReload = async () => { if (dirty.current && stateRef.current) await push(stateRef.current); };
  }, [push]);

  /* ── actions ── */
  const actions = useMemo(() => {
    const now = () => Date.now();
    const upsert = (list, item) => { const i = list.findIndex(x => x.id === item.id); const next = [...list]; if (i >= 0) next[i] = item; else next.push(item); return next; };
    const rememberFood = (foods, food) => {
      if (!food) return foods;
      const prev = foods.find(f => f.id === food.id);
      return upsert(foods, { ...prev, ...food, lastUsed: now(), uses: (prev?.uses || 0) + 1, created: prev?.created || now(), updated: now() });
    };
    return {
      addEntry(e, food) {
        setState(s => ({ ...s, entries: [...s.entries, { id: uid(), ...e, created: now(), updated: now() }], foods: rememberFood(s.foods, food) }));
      },
      updateEntry(e) { setState(s => ({ ...s, entries: upsert(s.entries, { ...e, updated: now() }) })); },
      removeEntry(id) { setState(s => ({ ...s, entries: s.entries.filter(x => x.id !== id), entriesDeleted: [...s.entriesDeleted, { id, deletedAt: now() }] })); },
      restoreEntry(e) { setState(s => ({ ...s, entries: upsert(s.entries, { ...e, updated: now() }), entriesDeleted: s.entriesDeleted.filter(t => t.id !== e.id) })); },
      saveFood(f) { setState(s => ({ ...s, foods: rememberFood(s.foods, f) })); },
      saveExercise(x) {
        setState(s => ({ ...s, exercise: upsert(s.exercise || [], { ...x, created: x.created || now(), updated: now() }), exerciseDeleted: (s.exerciseDeleted || []).filter(t => t.id !== x.id) }));
      },
      removeExercise(x) {
        setState(s => ({ ...s, exercise: (s.exercise || []).filter(y => y.id !== x.id), exerciseDeleted: [...(s.exerciseDeleted || []), { id: x.id, deletedAt: now() }] }));
        showToast('Workout deleted', () => setState(s => ({ ...s, exercise: upsert(s.exercise || [], { ...x, updated: Date.now() }), exerciseDeleted: (s.exerciseDeleted || []).filter(t => t.id !== x.id) })));
      },
      receiptCommit({ foods, entries, aliases }) {
        setState(s => {
          let fs = s.foods;
          for (const f of foods) fs = rememberFood(fs, f);
          return { ...s, foods: fs, entries: [...s.entries, ...entries], aliases: { ...s.aliases, ...aliases } };
        });
      },
      /* One reading per day: the id is the date, so a second weigh-in on the
         same day replaces the first rather than skewing the trend. */
      logWeight(date, kg, fatPct) {
        setState(s => {
          const prev = s.weights.find(w => w.id === 'w:' + date);
          const fat = fatPct > 2 && fatPct < 75 ? Math.round(fatPct * 10) / 10 : prev?.fatPct;
          return { ...s, weights: upsert(s.weights, { ...(prev || {}), id: 'w:' + date, date, kg: Math.round(kg * 100) / 100, ...(fat ? { fatPct: fat } : {}), source: 'manual', created: prev?.created || now(), updated: now() }),
                   weightsDeleted: s.weightsDeleted.filter(t => t.id !== 'w:' + date) };
        });
      },
      removeWeight(w) {
        setState(s => ({ ...s, weights: s.weights.filter(x => x.id !== w.id), weightsDeleted: [...s.weightsDeleted, { id: w.id, deletedAt: now() }] }));
        showToast('Weigh-in deleted', () => setState(s => ({ ...s, weights: upsert(s.weights, { ...w, updated: Date.now() }), weightsDeleted: s.weightsDeleted.filter(t => t.id !== w.id) })));
      },
      saveProfile(p) { setState(s => ({ ...s, profile: { ...p, updated: now() } })); showToast('Saved'); },
      adjustTarget(delta) {
        setState(s => {
          const cur = E.targets(s).kcal;
          const override = { ...(s.profile.override || {}), kcal: Math.round((cur + delta) / 10) * 10 };
          return { ...s, profile: { ...s.profile, override, updated: now() } };
        });
        showToast(`Target ${delta > 0 ? 'raised' : 'lowered'} by ${Math.abs(delta)} kcal`);
      },
      finishOnboarding(p) {
        setState(s => ({ ...s, profile: p, weights: p.startKg ? upsert(s.weights, { id: 'w:' + E.today(), date: E.today(), kg: p.startKg, created: now(), updated: now() }) : s.weights }));
      },
      importData({ entries, weights }) {
        const t = now();
        setState(s => {
          const em = new Map(s.entries.map(e => [e.id, e]));
          for (const e of entries) em.set(e.id, { ...e, created: em.get(e.id)?.created || t, updated: t });
          const wm = new Map(s.weights.map(w => [w.id, w]));
          for (const w of weights) if (!wm.has(w.id) || wm.get(w.id).source?.startsWith('import')) wm.set(w.id, { ...w, created: t, updated: t });
          const ids = new Set([...entries.map(e => e.id), ...weights.map(w => w.id)]);
          return { ...s, entries: [...em.values()], weights: [...wm.values()],
                   entriesDeleted: s.entriesDeleted.filter(x => !ids.has(x.id)), weightsDeleted: s.weightsDeleted.filter(x => !ids.has(x.id)) };
        });
      },
      restoreBackup(data) {
        setState(s => {
          const t = now();
          const stamp = (arr) => (arr || []).map(x => ({ ...x, updated: t }));
          return hydrate({ ...data, entries: stamp(data.entries), weights: stamp(data.weights), foods: stamp(data.foods),
            profile: data.profile ? { ...data.profile, updated: t } : s.profile });
        });
        showToast('Backup restored');
      },
    };
  }, [setState]);

  const open = (kind, arg) => {
    if (kind === 'view') { setView(arg); return; }
    setModal({ kind, arg });
  };
  const closeModal = (msg, undo) => { setModal(null); if (msg) showToast(msg, undo); };
  const go = (v) => { setView(v); document.querySelector('.main')?.scrollTo(0, 0); };
  const setTheme = (v) => { ThemePref.set(v); setThemeState(v); };
  const signOut = async (skipServer) => {
    clearTimeout(saveTimer.current);
    if (!skipServer) {
      if (dirty.current && stateRef.current) await push(stateRef.current);
      try { await api('/api/auth/logout', { method: 'POST', body: {} }); } catch {}
    }
    Cache.setUser(null); setAccount(null); setView('today');
  };

  if (account === undefined) return <div className="auth"><span className="spinner" style={{width:28,height:28}}/></div>;
  if (!account) return <AuthScreen onSignedIn={(u, extra) => { Cache.setUser(u); setAccount({ user: u }); loadAccount(); if (extra?.recoveryCode) setRecovery(extra); }}/>;
  if (!state) return <div className="auth"><span className="spinner" style={{width:28,height:28}}/></div>;

  const needsSetup = !state.profile?.done;
  const syncDot = { saving: 'var(--warning)', synced: 'var(--good)', offline: 'var(--danger)' }[sync];
  return (
    <div className="shell">
      <nav className="sidebar" aria-label="Main">
        <div className="brand"><img src="/tally-icon.svg" alt=""/>Tally</div>
        {!needsSetup && VIEWS.map(([id, label, icon]) => <button key={id} className={'nav-item' + (view === id ? ' active' : '')} onClick={() => go(id)}>{icon}{label}</button>)}
        {!needsSetup && <button className="btn primary" style={{marginTop:14}} onClick={() => open('add', {})}>{Ic.plus} Add food</button>}
        <div className="grow"/>
        <div className="row gap8 sub" style={{padding:'0 10px',fontSize:12}} title={sync}>
          {syncDot && <span style={{width:7,height:7,borderRadius:9,background:syncDot}}/>}
          {sync === 'offline' ? 'Offline · saved on this device' : sync === 'saving' ? 'Saving…' : sync === 'synced' ? 'Synced' : ''}
        </div>
      </nav>
      <main className="main">
        <div className="page">
          {needsSetup ? <Onboarding state={state} onDone={actions.finishOnboarding}/>
            : view === 'progress' ? <ProgressView state={state} actions={actions} open={open}/>
            : view === 'insights' ? <InsightsView state={state} actions={actions}/>
            : view === 'me' ? <MeView state={state} actions={actions} account={account} refreshAccount={loadAccount} theme={theme} setTheme={setTheme} open={open} signOut={signOut}/>
            : <TodayView state={state} actions={actions} date={date} setDate={setDate} open={open}/>}
        </div>
      </main>
      {!needsSetup && <>
        <nav className="tabbar glass" aria-label="Main">
          {VIEWS.map(([id, label, icon]) => <button key={id} className={view === id ? 'active' : ''} aria-current={view === id ? 'page' : undefined} onClick={() => go(id)}>{icon}{label}</button>)}
        </nav>
        <button className="tab-fab glass" aria-label="Add food" onClick={() => open('add', {})}>{Ic.plus}</button>
      </>}

      {modal?.kind === 'add' && <AddFoodSheet state={state} actions={actions} date={view === 'today' ? date : E.today()} meal={modal.arg?.meal} tab={modal.arg?.tab} onClose={closeModal}/>}
      {modal?.kind === 'entry' && <EntrySheet entry={modal.arg} state={state} actions={actions} onClose={closeModal}/>}
      {modal?.kind === 'weigh' && <WeighInSheet state={state} actions={actions} onClose={closeModal}/>}
      {modal?.kind === 'exercise' && <ExerciseSheet state={state} actions={actions} date={view === 'today' ? date : E.today()} item={modal.arg} onClose={closeModal}/>}
      {modal?.kind === 'import' && <ImportSheet state={state} actions={actions} onClose={closeModal}/>}
      {recovery && <RecoverySheet code={recovery.recoveryCode} isNew={recovery.isNew} onDone={() => { setRecovery(null); loadAccount(); }}/>}
      {updateReady && <div className="toast glass" role="status" style={{bottom:'auto',top:'calc(env(safe-area-inset-top,0px) + 12px)'}}>
        New version ready<button onClick={() => { setModal(null); Updates.reloadNow(); }}>Refresh</button></div>}
      {toast && <div className="toast glass" role="status" key={toast.id}>{toast.msg}{toast.undo && <button onClick={() => { toast.undo(); setToast(null); }}>Undo</button>}</div>}
    </div>);
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>

<script>
  /* Boot watchdog — plain JS, so it still runs if the app itself can't.
     If a bad cache or a broken deploy stops Tally from starting within 10s,
     offer a one-tap repair instead of a blank screen. */
  /* The clock starts once every script has downloaded, so a slow first
     visit on mobile data is never mistaken for a broken app. */
  window.addEventListener('load', function () { setTimeout(function () {
    if (window.__tallyMounted) return;
    var el = document.getElementById('app');
    if (!el) return;
    el.innerHTML = '<div style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,system-ui,sans-serif;text-align:center">'
      + '<div style="max-width:320px"><h1 style="font-size:22px;margin-bottom:8px">Tally didn’t start</h1>'
      + '<p style="opacity:.7;margin-bottom:18px;line-height:1.4">This can happen right after an update. Repairing reloads a fresh copy. Your data is safe.</p>'
      + '<button id="tally-repair" style="height:50px;padding:0 24px;border-radius:999px;border:0;background:#30d158;color:#000;font-weight:700;font-size:17px">Repair app</button></div></div>';
    document.getElementById('tally-repair').onclick = function () {
      var done = function () { try { sessionStorage.removeItem('tally_update_reload'); } catch (e) {} location.reload(); };
      Promise.resolve()
        .then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : []; })
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { return window.caches ? caches.keys() : []; })
        .then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('tally-') === 0; }).map(function (k) { return caches.delete(k); })); })
        .then(done, done);
    };
  }, 10000); });
</script>
</body>
</html>
